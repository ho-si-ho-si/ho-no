const LOOTLOCKER_LEADERBOARD_ID = "global_speedrun";
let lootLockerSession = "";
let playerLootLockerId = "Connecting...";
let activePlayersCount = 0;
let topScores = [];

function initLootLocker() {
    fetch("https://api.development.lootlocker.io/game/v1/player/auth/guest", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ game_key: LOOTLOCKER_GAME_KEY })
    })
    .then(res => res.json())
    .then(data => {
        if (data.session_token) {
            lootLockerSession = data.session_token;
            playerLootLockerId = data.player_id;
            console.log("LootLocker Session Started. Player ID:", playerLootLockerId);
            
            fetchActivePlayers();
            fetchLeaderboard();
        } else {
            console.error("LootLocker authentication payload failed:", data);
        }
    })
    .catch(err => console.error("Network error executing LootLocker login:", err));
}

function fetchActivePlayers() {
    if (!lootLockerSession) return;
    fetch(`https://api.lootlocker.io/game/leaderboards/${LOOTLOCKER_LEADERBOARD_ID}/list?count=100`, {
        method: "GET",
        headers: { "x-session-token": lootLockerSession }
    })
    .then(res => res.json())
    .then(data => {
        if (data.items) activePlayersCount = data.items.length;
    });
}

function fetchLeaderboard() {
    if (!lootLockerSession) return;
    fetch(`https://api.lootlocker.io/game/leaderboards/${LOOTLOCKER_LEADERBOARD_ID}/list?count=5`, {
        method: "GET",
        headers: { "x-session-token": lootLockerSession }
    })
    .then(res => res.json())
    .then(data => {
        if (data.items) {
            topScores = data.items.map(item => ({
                rank: item.rank,
                id: item.player.id,
                score: item.score
            }));
        }
    });
}

function submitScoreToLootLocker(scoreMs) {
    if (!lootLockerSession) return;
    fetch(`https://api.lootlocker.io/game/leaderboards/${LOOTLOCKER_LEADERBOARD_ID}/submit`, {
        method: "POST",
        headers: { 
            "Content-Type": "application/json",
            "x-session-token": lootLockerSession 
        },
        body: JSON.stringify({ score: scoreMs })
    })
    .then(res => res.json())
    .then(data => {
        console.log("Score Submitted:", data);
        fetchLeaderboard();
    });
}

function formatTime(ms) {
    let minutes = Math.floor(ms / 60000);
    let seconds = Math.floor((ms % 60000) / 1000);
    let centiseconds = Math.floor((ms % 1000) / 10);

    let mm = minutes.toString().padStart(2, '0');
    let ss = seconds.toString().padStart(2, '0');
    let cc = centiseconds.toString().padStart(2, '0');

    return `${mm}:${ss}.${cc}`;
}

function preloadSelectionImages(callback) {
    let loaded = 0;
    const keys = ['char1', 'char3', 'char2'];
    const paths = [CHARACTERS.char1.player, CHARACTERS.char3.player, CHARACTERS.char2.player];
    let done = false;
    
    const checkDone = () => {
        loaded++;
        if (loaded === paths.length && !done) { done = true; callback(); }
    };

    paths.forEach((path, i) => {
        const img = new Image();
        img.onload = checkDone;
        img.onerror = checkDone;
        img.src = path;
        uiImages[keys[i]] = img;
    });
}

function loadGameplayAssets(callback) {
    let imagesLoaded = 0;

        imagesLoaded++;

        const img = new Image();
        img.onload = checkDone;
        img.onerror = checkDone;
        img.src = ASSETS[key];
        images[key] = img;
    });
}

class Fireball {
    constructor(x, y, vx, vy) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.r = 12;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        if(this.x < -100 || this.x > V_WIDTH + 100 || this.y < -100 || this.y > V_HEIGHT + 100) return false;
        return true;
    }
    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fillStyle = '#ff3300';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r * 0.6, 0, Math.PI * 2);
        ctx.fillStyle = '#ffcc00';
        ctx.fill();
    }
}

class Player {
    constructor(x, y) { this.w = P_WIDTH; this.h = P_HEIGHT; this.reset(x, y); }
    reset(x, y) { this.x = x; this.y = y; this.vx = 0; this.vy = 0; this.grounded = false; }
    update(platforms) {
        if (keys.left) this.vx = -7;
        else if (keys.right) this.vx = 7;
        else this.vx = 0;
        this.vy += gravity;
        this.x += this.vx; this.collide(platforms, 'h');
        this.y += this.vy; this.grounded = false; this.collide(platforms, 'v');
        if (this.y > V_HEIGHT) this.reset(LEVELS[currentLevel].playerStart.x, LEVELS[currentLevel].playerStart.y);
    }
    collide(platforms, dir) {
        platforms.forEach(p => {
            if (this.x < p.x + p.w && this.x + this.w > p.x && this.y < p.y + p.h && this.y + this.h > p.y) {
                if (dir === 'h') this.x = (this.vx > 0) ? p.x - this.w : p.x + p.w;
                else {
                    if (this.vy > 0) { this.y = p.y - this.h; this.grounded = true; }
                    else this.y = p.y + p.h;
                    this.vy = 0;
                }
            }
        });
    }
    draw() {
        if (images.player && images.player.complete && images.player.width > 0) {
            ctx.drawImage(images.player, this.x, this.y, this.w, this.h);
        } else {
            ctx.fillStyle = '#FF5733'; ctx.fillRect(this.x, this.y, this.w, this.h);
        }
    }
}

class Enemy {
    constructor(data) {
        this.type = data.type || 'patrol';
        this.w = data.w || P_WIDTH; this.h = data.h || P_HEIGHT; 
        this.x = data.x; this.y = data.y;
        this.minX = data.minX || 0; this.maxX = data.maxX || V_WIDTH;
        this.dir = 1;
        this.fvx = data.vx || 0; this.fvy = data.vy || 0;
        this.rate = data.rate || 60; this.timer = 0;

        if (this.type === 'boss') {
            this.hp = 5;
            this.maxHp = 5;
            this.stateTimer = 0;
            this.attackState = 0; 
            this.bossVx = 4;
            this.isDead = false;
            this.deathTimer = 0;
            this.crownX = 0;
            this.crownY = 0;
            this.crownVx = -4;
            this.crownVy = -15;
            this.crownAngle = 0;
            this.initialW = this.w;
            this.initialH = this.h;
        }
    }
    update() {
        if (this.type === 'boss') {
            if (this.isDead) {
                this.deathTimer++;
                this.crownX += this.crownVx;
                this.crownY += this.crownVy;
                this.crownVy += gravity;
                this.crownAngle += 0.1;

                let targetX = (V_WIDTH - this.w) / 2;
                let targetY = (V_HEIGHT - this.h) / 2;
                this.x += (targetX - this.x) * 0.1;
                this.y += (targetY - this.y) * 0.1;

                let scale = Math.max(0, 1 - (this.deathTimer / 100));
                this.w = this.initialW * scale;
                this.h = this.initialH * scale;

                if (this.deathTimer >= 100) {
                    this.w = 0;
                    this.h = 0;
                }
                return;
            }

            this.stateTimer++;
            if (this.stateTimer > 200) {
                this.stateTimer = 0;
                this.attackState = Math.floor(Math.random() * 3);
            }

            if (this.attackState === 0) { 
                this.x += this.bossVx;
                if(this.x < 300 || this.x > 750) this.bossVx *= -1;
                this.y = 150 + Math.sin(this.stateTimer * 0.05) * 30;

                if (this.stateTimer % 35 === 0) {
                    fireballs.push(new Fireball(this.x + this.w/2, this.y + this.h, (Math.random() - 0.5) * 4, 5));
                }
            } 
            else if (this.attackState === 1) { 
                this.x += this.bossVx * 1.5;
                if(this.x < 100 || this.x > 950) this.bossVx *= -1;
                this.y = 550 - Math.abs(Math.sin(this.stateTimer * 0.04) * 400);
                
                if (this.stateTimer % 45 === 0) {
                    fireballs.push(new Fireball(this.x, this.y + this.h/2, -5, 0));
                    fireballs.push(new Fireball(this.x + this.w, this.y + this.h/2, 5, 0));
                }
            } 
            else if (this.attackState === 2) { 
                this.x = 520;
                this.y = 450;
                if (this.stateTimer === 20 || this.stateTimer === 100) {
                    for(let i = -2; i <= 2; i++) {
                        fireballs.push(new Fireball(this.x + this.w/2, this.y + this.h/2, i * 2, -5));
                    }
                }
            }
        }
        else if (this.type === 'patrol') {
            this.x += 3 * this.dir;
            if (this.x >= this.maxX - this.w || this.x <= this.minX) this.dir *= -1;
        } 
        else if (this.type === 'fireball') {
            this.timer++;
            if (this.timer >= this.rate) {
                this.timer = 0;
                fireballs.push(new Fireball(this.x + this.w / 2, this.y + this.h / 2, this.fvx, this.fvy));
            }
        }
    }
    draw() {
        if (this.type === 'boss') {
            if (this.w > 0 && this.h > 0) {
                let bossImg = (this.attackState === 2) ? images.bossState2 : images.bossState1;
                if (bossImg && bossImg.complete && bossImg.width > 0) {
                    ctx.drawImage(bossImg, this.x, this.y, this.w, this.h);
                } else {
                    ctx.fillStyle = this.attackState === 2 ? '#9b59b6' : '#d35400';
                    ctx.fillRect(this.x, this.y, this.w, this.h);
                }

                if (!this.isDead) {
                    let crownW = this.w * (256 / 418);
                    let crownH = crownW * (197 / 256); 
                
                    let crownX = this.x + (this.w - crownW) / 2;
                
                    let crownY = this.y - crownH + (crownH * 0.55);
                
                    if (images.bossCrown && images.bossCrown.complete && images.bossCrown.width > 0) {
                        ctx.drawImage(images.bossCrown, crownX, crownY, crownW, crownH);
                    } else {
                        ctx.fillStyle = '#f1c40f';
                        ctx.beginPath();
                        ctx.moveTo(crownX, crownY + crownH);
                        ctx.lineTo(crownX, crownY);
                        ctx.lineTo(crownX + crownW/4, crownY + crownH/2);
                        ctx.lineTo(crownX + crownW/2, crownY);
                        ctx.lineTo(crownX + (3*crownW)/4, crownY + crownH/2);
                        ctx.lineTo(crownX + crownW, crownY);
                        ctx.lineTo(crownX + crownW, crownY + crownH);
                        ctx.closePath();
                        ctx.fill();
                    }
                }
            }

            if (this.isDead && this.deathTimer < 100) {
                ctx.save();
                ctx.translate(this.crownX, this.crownY);
                ctx.rotate(this.crownAngle);
                let cW = this.initialW * 0.65;
                let cH = cW * 0.42;
                if (images.bossCrown && images.bossCrown.complete && images.bossCrown.width > 0) {
                    ctx.drawImage(images.bossCrown, -cW/2, -cH/2, cW, cH);
                } else {
                    ctx.fillStyle = '#f1c40f';
                    ctx.beginPath();
                    ctx.moveTo(-cW/2, cH/2);
                    ctx.lineTo(-cW/2, -cH/2);
                    ctx.lineTo(-cW/4, 0);
                    ctx.lineTo(0, -cH/2);
                    ctx.lineTo(cW/4, 0);
                    ctx.lineTo(cW/2, -cH/2);
                    ctx.lineTo(cW/2, cH/2);
                    ctx.closePath();
                    ctx.fill();
                }
                ctx.restore();
            }

            if (!this.isDead) {
                ctx.fillStyle = '#c0392b';
                ctx.fillRect(400, 60, 400, 20);
                ctx.fillStyle = '#2ecc71';
                ctx.fillRect(400, 60, 400 * (this.hp / this.maxHp), 20);
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
                ctx.strokeRect(400, 60, 400, 20);
            }
            return;
        }

        if (this.type === 'fireball') {
            if (images.fireEnemy && images.fireEnemy.complete && images.fireEnemy.width > 0) {
                ctx.drawImage(images.fireEnemy, this.x, this.y, this.w, this.h);
            } else {
                ctx.fillStyle = '#e67e22'; ctx.fillRect(this.x, this.y, this.w, this.h);
                ctx.fillStyle = '#f1c40f'; ctx.fillRect(this.x + 10, this.y + 10, this.w - 20, this.h - 20);
            }
            return;
        }

        if (images.enemy && images.enemy.complete && images.enemy.width > 0) {
            ctx.drawImage(images.enemy, this.x, this.y, this.w, this.h);
        } else {
            ctx.fillStyle = '#8B0000'; ctx.fillRect(this.x, this.y, this.w, this.h);
        }
    }
}

            let totalElapsed = Date.now() - startTime;
            finalTimeText = "TEMPO: " + formatTime(totalElapsed);
            
            submitScoreToLootLocker(totalElapsed);
        } else {
            finalTimeText = "TEST";
        }
        document.getElementById('ui').style.display = 'none';
        gameState = 'END'; 
        return; 
    }
    currentLevel = idx;
    const data = LEVELS[idx];
    player = new Player(data.playerStart.x, data.playerStart.y);
    platforms = data.platforms;
    flag = data.flag;
    enemies = data.enemies.map(e => new Enemy(e));
    document.getElementById('lvlDisplay').innerText = idx + 1;
}

function init() {
    setupInputs();
    resize();
    window.addEventListener('resize', resize);
    
    initLootLocker();

    preloadSelectionImages(() => {
        gameState = 'SELECT';
        requestAnimationFrame(loop);
    });
}

function resize() {
    const scale = Math.min(window.innerWidth / V_WIDTH, window.innerHeight / V_HEIGHT);
    canvas.width = V_WIDTH * scale; canvas.height = V_HEIGHT * scale;
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
}

let audioUnlocked = false;

function startAudio() {
    if (!audioStarted) {
        const music = document.getElementById('bgMusic');
        music.volume = 0.4; 
        
        music.loop = true;

        music.addEventListener('ended', function() {
            this.currentTime = 0;
            this.play().catch(err => console.log("Loop failed:", err));
        }, false);

        music.play()
            .then(() => {
                audioStarted = true;
            })
            .catch(err => {
                console.log("Audio waiting for stronger user gesture:", err);
            });
    }
}

function handleSelectionClick(canvasX, canvasY) {
    if (gameState === 'SELECT') {
        selectButtons.forEach(btn => {
            if (canvasX >= btn.x && canvasX <= btn.x + btn.w && canvasY >= btn.y && canvasY <= btn.y + btn.h) {
                ASSETS.player = CHARACTERS[btn.id].player;
                ASSETS.flag = CHARACTERS[btn.id].flag;
                activeVictoryText = CHARACTERS[btn.id].victoryText;
                
                loadGameplayAssets(() => {
                    gameState = 'LEVEL_SELECT';
                });
            }
        });
    } else if (gameState === 'LEVEL_SELECT') {
        levelSelectButtons.forEach(btn => {
            if (canvasX >= btn.x && canvasX <= btn.x + btn.w && canvasY >= btn.y && canvasY <= btn.y + btn.h) {
                document.getElementById('ui').style.display = 'flex';
                document.getElementById('touchControls').style.display = 'flex';
                
                if (btn.levelIndex === 0) {
                    startTime = Date.now();
                    isTimerActive = true;
                } else {
                    isTimerActive = false;
                    document.getElementById('timerDisplay').innerText = "MODALITÀ TEST";
                }
                
                loadLevel(btn.levelIndex);
                gameState = 'PLAY';
            }
        });
    }
}

function setupInputs() {
    const bL = document.getElementById('btnLeft'), bR = document.getElementById('btnRight'), bJ = document.getElementById('btnJump');
    
    const getCanvasCoordinates = (e) => {
        startAudio();
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        const scaleX = V_WIDTH / rect.width;
        const scaleY = V_HEIGHT / rect.height;
        const x = (clientX - rect.left) * scaleX;
        const y = (clientY - rect.top) * scaleY;
        
        if (gameState === 'SELECT' || gameState === 'LEVEL_SELECT') handleSelectionClick(x, y);
    };
    canvas.addEventListener('mousedown', getCanvasCoordinates);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); getCanvasCoordinates(e); });

    bL.addEventListener('touchstart', (e) => { e.preventDefault(); keys.left = true; });
    bL.addEventListener('touchend', (e) => { e.preventDefault(); keys.left = false; });
    bL.addEventListener('mousedown', () => { keys.left = true; });
    bL.addEventListener('mouseup', () => { keys.left = false; });
    bL.addEventListener('mouseleave', () => { keys.left = false; });

    bR.addEventListener('touchstart', (e) => { e.preventDefault(); keys.right = true; });
    bR.addEventListener('touchend', (e) => { e.preventDefault(); keys.right = false; });
    bR.addEventListener('mousedown', () => { keys.right = true; });
    bR.addEventListener('mouseup', () => { keys.right = false; });
    bR.addEventListener('mouseleave', () => { keys.right = false; });

    const triggerJump = (e) => { 
        if(e) e.preventDefault(); 
        if(player && player.grounded) player.vy = -22; 
    };
    bJ.addEventListener('touchstart', triggerJump);
    bJ.addEventListener('mousedown', triggerJump);

    window.addEventListener('keydown', e => {
        startAudio();
        if(e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
        if(e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
        if(e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') if(player && player.grounded) player.vy = -22;
    });
    window.addEventListener('keyup', e => {
        if(e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
        if(e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    });
}

function drawSelectionScreen() {
    animationTimer += 0.04;

    ctx.fillStyle = 'white'; ctx.font = 'bold 48px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('SCONFIGGI I SARCHIAPONI!', V_WIDTH / 2, 120);

    selectButtons.forEach((btn, index) => {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 4;
        ctx.fillRect(btn.x, btn.y, btn.w, btn.h);
        ctx.strokeRect(btn.x, btn.y, btn.w, btn.h);

        ctx.fillStyle = '#f1c40f'; ctx.font = 'bold 36px sans-serif';
        ctx.fillText(CHARACTERS[btn.id].name, btn.x + btn.w / 2, btn.y - 25);

        ctx.save();
        ctx.translate(btn.x + btn.w / 2, btn.y + btn.h / 2);
        
        if (btn.id === 'char3') {
            const pulseScale = 1 + Math.sin(animationTimer) * 0.15;
            ctx.scale(pulseScale, pulseScale);
        } else {
            const rotationDirection = index === 0 ? 1 : -1;
            const angle = Math.sin(animationTimer) * 0.12 * rotationDirection; 
            ctx.rotate(angle);
        }
        
        const img = uiImages[btn.id];
        if (img && img.complete && img.width > 0) {
            ctx.drawImage(img, -90, -150, 180, 300);
        } else {
            if (btn.id === 'char1') ctx.fillStyle = '#FF5733';
            else if (btn.id === 'char3') ctx.fillStyle = '#2ECC71';
            else ctx.fillStyle = '#3399FF';
            ctx.fillRect(-60, -100, 120, 200);
        }
        ctx.restore();
    });
}

function drawLevelSelectScreen() {
    ctx.fillStyle = 'white'; ctx.font = 'bold 48px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('SELECT A LEVEL', V_WIDTH / 2, 160);

    levelSelectButtons.forEach(btn => {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = 3;
        
        ctx.fillRect(btn.x, btn.y, btn.w, btn.h);
        ctx.strokeRect(btn.x, btn.y, btn.w, btn.h);

        ctx.fillStyle = '#fff'; ctx.font = 'bold 32px sans-serif';
        ctx.fillText(btn.levelIndex + 1, btn.x + btn.w / 2, btn.y + btn.h / 2 + 11);
    });
}

function loop() {
    ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);
    
    if (gameState === 'SELECT') {
        drawSelectionScreen();
        
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.font = '20px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(`GIOCATORI REGISTRATI: ${activePlayersCount}`, V_WIDTH - 40, 40);

    } else if (gameState === 'LEVEL_SELECT') {
        drawLevelSelectScreen();
    } else if (gameState === 'PLAY') {
        player.update(platforms);

        fireballs = fireballs.filter(fb => {
            let active = fb.update();
            fb.draw();

            let distX = Math.abs(fb.x - (player.x + player.w/2));
            let distY = Math.abs(fb.y - (player.y + player.h/2));
            if (distX < (player.w/2 + fb.r) && distY < (player.h/2 + fb.r)) {
                player.reset(LEVELS[currentLevel].playerStart.x, LEVELS[currentLevel].playerStart.y);
            }
            return active;
        });

        enemies.forEach(e => {
            e.update();
            
            if (!e.isDead && player.x < e.x + e.w && player.x + player.w > e.x && player.y < e.y + e.h && player.y + player.h > e.y) {
                if (e.type === 'boss') {
                    if (player.vy > 0 && player.y + player.h - player.vy <= e.y + 40) {
                        e.hp--;
                        player.vy = -18; 
                        if (e.hp <= 0) {
                            e.isDead = true;
                            e.crownX = e.x + e.w / 2;
                            e.crownY = e.y;
                        }
                    } else {
                        player.reset(LEVELS[currentLevel].playerStart.x, LEVELS[currentLevel].playerStart.y);
                    }
                } else {
                    player.reset(LEVELS[currentLevel].playerStart.x, LEVELS[currentLevel].playerStart.y);
                }
            }
        });

        let isBossLevel = (currentLevel === 9);
        let bossActive = enemies.some(e => e.type === 'boss' && (!e.isDead || e.deathTimer < 100));

        if (!bossActive || !isBossLevel) {
            if (player.x < flag.x + 60 && player.x + player.w > flag.x && player.y < flag.y + 100 && player.y + player.h > flag.y) {
                currentLevel++; loadLevel(currentLevel);
            }
        }

        if (isTimerActive) {
            let elapsed = Date.now() - startTime;
            document.getElementById('timerDisplay').innerText = formatTime(elapsed);
        }

        platforms.forEach(p => { ctx.fillStyle = '#34495e'; ctx.fillRect(p.x, p.y, p.w, p.h); });
        enemies.forEach(e => e.draw());
        player.draw();
        
        if (!bossActive || !isBossLevel) {
            if (images.flag && images.flag.complete && images.flag.width > 0) {
                ctx.drawImage(images.flag, flag.x, flag.y, 60, 100);
            } else {
                ctx.fillStyle = '#f1c40f'; ctx.fillRect(flag.x, flag.y, 60, 100);
            }
        } else {
            if (images.flagGrey && images.flagGrey.complete && images.flagGrey.width > 0) {
                ctx.drawImage(images.flagGrey, flag.x, flag.y, 60, 100);
            } else {
                ctx.fillStyle = '#7f8c8d'; ctx.fillRect(flag.x, flag.y, 60, 100);
                ctx.fillStyle = '#c0392b'; ctx.fillRect(flag.x + 25, flag.y, 10, 100);
            }
        }
    } else {
        ctx.textAlign = 'center';
        ctx.fillStyle = 'white'; 
        ctx.font = 'bold 60px sans-serif'; 
        ctx.fillText(activeVictoryText, V_WIDTH / 2, V_HEIGHT / 2 - 140);
        
        ctx.fillStyle = '#f1c40f'; 
        ctx.font = 'bold 40px sans-serif'; 
        ctx.fillText(finalTimeText, V_WIDTH / 2, V_HEIGHT / 2 - 70);
        
        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.fillRect(V_WIDTH / 2 - 250, V_HEIGHT / 2 - 30, 500, 260);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.strokeRect(V_WIDTH / 2 - 250, V_HEIGHT / 2 - 30, 500, 260);

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 24px sans-serif';
        ctx.fillText("CLASSIFICA GLOBALE (TOP 5)", V_WIDTH / 2, V_HEIGHT / 2 + 10);

        ctx.font = '20px sans-serif';
        if (topScores.length === 0) {
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.fillText("Nessun record caricato...", V_WIDTH / 2, V_HEIGHT / 2 + 80);
        } else {
            topScores.forEach((row, i) => {
                ctx.textAlign = 'left';
                ctx.fillStyle = (row.id === playerLootLockerId) ? '#2ecc71' : '#fff';
                ctx.fillText(`#${row.rank} Player ${row.id}`, V_WIDTH / 2 - 200, V_HEIGHT / 2 + 60 + (i * 35));
                
                ctx.textAlign = 'right';
                ctx.fillText(formatTime(row.score), V_WIDTH / 2 + 200, V_HEIGHT / 2 + 60 + (i * 35));
            });
        }
    }
    requestAnimationFrame(loop);
}

init();
</script>
</body>
</html>
