<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HO SI!</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #111; font-family: sans-serif; }
        #gameContainer { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        canvas { background: linear-gradient(to bottom, #2c3e50, #000000); display: block; }
        #touchControls { position: absolute; bottom: 30px; left: 0; width: 100%; display: flex; justify-content: space-between; padding: 0 40px; pointer-events: none; display: none; }
        .control-group { display: flex; gap: 25px; pointer-events: auto; }
        .btn { width: 80px; height: 80px; background-color: rgba(255, 255, 255, 0.2); border: 4px solid rgba(255, 255, 255, 0.4); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 30px; touch-action: manipulation; }
        .btn:active { background-color: rgba(255, 255, 255, 0.5); }
        #ui { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; color: #fff; font-size: 24px; font-weight: bold; text-shadow: 2px 2px #000; pointer-events: none; display: none; }

        /* ── Overlay panels ── */
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.82);
            z-index: 100;
            padding: 20px;
        }
        .overlay.hidden { display: none; }

        /* Leaderboard panel */
        #leaderboardOverlay h2 {
            color: #f1c40f;
            font-size: 36px;
            letter-spacing: 4px;
            margin-bottom: 18px;
            text-shadow: 0 0 20px #f1c40f88;
            font-family: sans-serif;
        }
        #lbTable {
            width: 640px;
            max-width: 98vw;
            border-collapse: collapse;
        }
        #lbTable th {
            color: #aaa;
            font-size: 14px;
            letter-spacing: 2px;
            padding: 8px 12px;
            border-bottom: 1px solid #333;
            text-align: left;
        }
        #lbTable td {
            padding: 10px 12px;
            color: #fff;
            font-size: 18px;
            border-bottom: 1px solid #222;
        }
        #lbTable tr:first-child td { color: #f1c40f; font-weight: bold; }
        #lbTable tr:nth-child(2) td { color: #ccc; }
        #lbTable tr:nth-child(3) td { color: #cd7f32; }
        .rank-badge {
            display: inline-block;
            width: 28px; height: 28px;
            line-height: 28px;
            text-align: center;
            border-radius: 50%;
            background: #222;
            font-size: 13px;
            font-weight: bold;
        }
        .lb-close-btn {
            margin-top: 22px;
            padding: 12px 40px;
            background: #f1c40f;
            color: #111;
            border: none;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 2px;
        }
        .lb-close-btn:hover { background: #ffe066; }
        #lbStatus { color: #aaa; font-size: 15px; margin-bottom: 10px; }

        /* Submit score panel */
        #submitOverlay h2 {
            color: #f1c40f;
            font-size: 34px;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }
        #submitOverlay .time-display {
            color: #fff;
            font-size: 28px;
            margin-bottom: 24px;
            font-weight: bold;
        }
        #playerNameInput {
            width: 320px;
            max-width: 90vw;
            padding: 14px 18px;
            font-size: 22px;
            border-radius: 8px;
            border: 3px solid #f1c40f;
            background: #1a1a2e;
            color: #fff;
            text-align: center;
            outline: none;
            letter-spacing: 2px;
            margin-bottom: 18px;
            user-select: text;
            -webkit-user-select: text;
        }
        #playerNameInput::placeholder { color: #555; }
        .submit-row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .submit-btn {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: 2px;
        }
        .submit-btn.primary { background: #f1c40f; color: #111; }
        .submit-btn.primary:hover { background: #ffe066; }
        .submit-btn.secondary { background: #333; color: #fff; }
        .submit-btn.secondary:hover { background: #444; }
        #submitStatus { color: #aaa; font-size: 15px; margin-top: 12px; min-height: 22px; }

        /* Live player count badge */
        #playerCountBadge {
            position: absolute;
            top: 14px;
            right: 18px;
            background: rgba(0,0,0,0.7);
            border: 2px solid #f1c40f44;
            border-radius: 20px;
            padding: 6px 16px;
            color: #f1c40f;
            font-size: 15px;
            font-weight: bold;
            pointer-events: none;
            z-index: 50;
            display: none;
            letter-spacing: 1px;
        }
        #playerCountBadge .dot {
            display: inline-block;
            width: 9px; height: 9px;
            background: #2ecc71;
            border-radius: 50%;
            margin-right: 7px;
            animation: pulse 1.6s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Leaderboard button on SELECT / LEVEL_SELECT screens */
        #lbOpenBtn {
            position: absolute;
            bottom: 22px;
            right: 22px;
            background: rgba(241,196,15,0.15);
            border: 2px solid #f1c40f;
            color: #f1c40f;
            font-size: 15px;
            font-weight: bold;
            padding: 10px 22px;
            border-radius: 10px;
            cursor: pointer;
            letter-spacing: 2px;
            z-index: 50;
            display: none;
        }
        #lbOpenBtn:hover { background: rgba(241,196,15,0.3); }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="ui">
        <div>LEVEL: <span id="lvlDisplay">1</span></div>
        <div>TIME: <span id="timerDisplay">00:00.00</span></div>
    </div>
    <canvas id="gameCanvas"></canvas>
    
    <audio id="bgMusic" loop src="skunkorlicorice.mp3"></audio>

    <div id="playerCountBadge"><span class="dot"></span><span id="playerCountText">? online</span></div>

    <button id="lbOpenBtn" onclick="openLeaderboard()">🏆 CLASSIFICA</button>

    <div id="leaderboardOverlay" class="overlay hidden">
        <h2>🏆 CLASSIFICA GLOBALE</h2>
        <div id="lbStatus">Loading...</div>
        <table id="lbTable">
            <thead><tr><th>#</th><th>NOME &amp; CHARACTER</th><th>TEMPO</th></tr></thead>
            <tbody id="lbBody"></tbody>
        </table>
        <button class="lb-close-btn" onclick="closeLeaderboard()">INDIETRO</button>
    </div>

    <div id="submitOverlay" class="overlay hidden">
        <h2>🎉 FINITO!</h2>
        <div class="time-display" id="submitTimeDisplay"></div>
        <input id="playerNameInput" type="text" maxlength="20" placeholder="IL TUO NOME" autocomplete="off" spellcheck="false" />
        <div class="submit-row">
            <button class="submit-btn primary" onclick="submitScore()">INVIA</button>
            <button class="submit-btn secondary" onclick="skipSubmit()">SALTA</button>
            <button class="submit-btn secondary" onclick="openLeaderboardFromEnd()">VEDI TEMPI</button>
        </div>
        <div id="submitStatus"></div>
    </div>

    <div id="touchControls">
        <div class="control-group">
            <div id="btnLeft" class="btn">←</div>
            <div id="btnRight" class="btn">→</div>
        </div>
        <div class="control-group">
            <div id="btnJump" class="btn">UP</div>
        </div>
    </div>
</div>

<script>

// ════════════════════════════════════════════════════════════
//  ██╗      ██████╗  ██████╗ ████████╗██╗      ██████╗  ██████╗██╗  ██╗███████╗██████╗
//  LOOTLOCKER CONFIGURATION
//  ════════════════════════════════════════════════════════════
const LOOTLOCKER_GAME_KEY      = "YOUR_GAME_KEY_HERE";       // ← paste Game API Key
const LOOTLOCKER_GAME_ID       = "YOUR_GAME_ID_HERE";        // ← paste numeric Game ID  
const LOOTLOCKER_LEADERBOARD_KEY = "YOUR_LEADERBOARD_KEY_HERE"; // ← paste Leaderboard Key
const LOOTLOCKER_API           = "https://api.lootlocker.io/game";

// ════════════════════════════════════════════════════════════
//  LOOTLOCKER SESSION & LEADERBOARD HELPERS
// ════════════════════════════════════════════════════════════

let llSessionToken = null;
let llPlayerId     = null;

async function llStartGuestSession() {
    if (llSessionToken) return true; // already have a session

    let guestId = localStorage.getItem("ll_guest_id");
    if (!guestId) {
        guestId = "guest_" + Math.random().toString(36).substr(2, 12);
        localStorage.setItem("ll_guest_id", guestId);
    }

    try {
        const res = await fetch(`${LOOTLOCKER_API}/v2/session/guest`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "x-game-key": LOOTLOCKER_GAME_KEY,
                "x-game-version": "1.0.0"
            },
            body: JSON.stringify({
                game_key: LOOTLOCKER_GAME_KEY,
                game_version: "1.0.0",
                identifier: guestId
            })
        });
        const data = await res.json();
        if (data.success) {
            llSessionToken = data.session_token;
            llPlayerId     = data.player_id;
            return true;
        }
        console.warn("LootLocker session failed:", data);
        return false;
    } catch (e) {
        console.warn("LootLocker session error:", e);
        return false;
    }
}

async function llSubmitScore(name, timeMs, charName, charPlayer) {
    const ok = await llStartGuestSession();
    if (!ok) return { success: false, error: "No session" };

    const meta = JSON.stringify({ n: name, c: charName, p: charPlayer });
    try {
        const res = await fetch(`${LOOTLOCKER_API}/leaderboards/${LOOTLOCKER_LEADERBOARD_KEY}/submit`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "x-session-token": llSessionToken
            },
            body: JSON.stringify({ score: timeMs, member_id: String(llPlayerId), metadata: meta })
        });
        const data = await res.json();
        return data;
    } catch (e) {
        return { success: false, error: String(e) };
    }
}

async function llGetLeaderboard(count = 15) {
    const ok = await llStartGuestSession();
    if (!ok) return null;

    try {
        const res = await fetch(`${LOOTLOCKER_API}/leaderboards/${LOOTLOCKER_LEADERBOARD_KEY}/list?count=${count}`, {
            headers: { "x-session-token": llSessionToken }
        });
        const data = await res.json();
        return data;
    } catch (e) {
        return null;
    }
}

async function llFetchPlayerCount() {
    try {
        const res = await fetch(`${LOOTLOCKER_API}/v1/player/count`, {
            headers: {
                "x-game-key": LOOTLOCKER_GAME_KEY,
                "x-game-version": "1.0.0"
            }
        });
        const data = await res.json();
        return data.count ?? null;
    } catch (_) { return null; }
}

// ════════════════════════════════════════════════════════════
//  UI HELPERS
// ════════════════════════════════════════════════════════════

function formatTime(ms) {
    let minutes      = Math.floor(ms / 60000);
    let seconds      = Math.floor((ms % 60000) / 1000);
    let centiseconds = Math.floor((ms % 1000) / 10);
    return `${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}.${String(centiseconds).padStart(2,'0')}`;
}

function updateLbBtnVisibility() {
    const btn = document.getElementById('lbOpenBtn');
    btn.style.display = (gameState === 'SELECT' || gameState === 'LEVEL_SELECT') ? 'block' : 'none';
}

async function refreshPlayerCount() {
    const badge = document.getElementById('playerCountBadge');
    const countEl = document.getElementById('playerCountText');
    const count = await llFetchPlayerCount();
    if (count !== null) {
        countEl.textContent = count + " online";
        badge.style.display = 'block';
    }
}

// ─── Leaderboard overlay ───
async function openLeaderboard() {
    const overlay = document.getElementById('leaderboardOverlay');
    const statusEl = document.getElementById('lbStatus');
    const tbody = document.getElementById('lbBody');
    overlay.classList.remove('hidden');
    statusEl.textContent = "Loading...";
    tbody.innerHTML = "";

    const data = await llGetLeaderboard(15);
    statusEl.textContent = "";
    if (!data || !data.items || data.items.length === 0) {
        statusEl.textContent = data ? "Nessun tempo - prova ad essere il primo!" : "Server non raggiunto.";
        return;
    }

    data.items.forEach((entry, i) => {
        const rank = i + 1;

        let displayName = "???";
        let charTag = "";
        try {
            const meta = JSON.parse(entry.metadata);
            if (meta && meta.n) displayName = meta.n;
            if (meta && meta.c && meta.p) charTag = `<span style="font-size:13px;color:#aaa;margin-left:6px;">${escHtml(meta.c)} [${escHtml(meta.p)}]</span>`;
        } catch (_) {
            if (entry.metadata) displayName = entry.metadata;
        }

        const timeStr = formatTime(entry.score);
        const medals = ["🥇","🥈","🥉"];
        const rankDisplay = rank <= 3 ? medals[rank-1] : `<span class="rank-badge">${rank}</span>`;
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${rankDisplay}</td><td>${escHtml(displayName)}${charTag}</td><td>${timeStr}</td>`;
        tbody.appendChild(tr);
    });
}

function closeLeaderboard() {
    document.getElementById('leaderboardOverlay').classList.add('hidden');
}

// ─── Submit overlay ───
function showSubmitOverlay(timeMs) {
    document.getElementById('submitTimeDisplay').textContent = "TEMPO: " + formatTime(timeMs);
    document.getElementById('submitStatus').textContent = "";
    document.getElementById('playerNameInput').value = localStorage.getItem("ll_last_name") || "";
    document.getElementById('submitOverlay').classList.remove('hidden');
}

async function submitScore() {
    const input   = document.getElementById('playerNameInput');
    const statusEl = document.getElementById('submitStatus');
    const name    = input.value.trim() || "ANONIMO";
    localStorage.setItem("ll_last_name", name);

    statusEl.textContent = "Submitting...";
    const result = await llSubmitScore(name, pendingScoreMs, activeCharName, activeCharPlayer);

    if (result && result.success !== false) {
        statusEl.textContent = "✅ Tempo inviato!";
        setTimeout(() => {
            document.getElementById('submitOverlay').classList.add('hidden');
            showEndScreen();
        }, 1400);
    } else {
        statusEl.textContent = "❌ Invio fallito. Controlla chiavi API.";
    }
}

function skipSubmit() {
    document.getElementById('submitOverlay').classList.add('hidden');
    showEndScreen();
}

async function openLeaderboardFromEnd() {
    document.getElementById('submitOverlay').classList.add('hidden');
    await openLeaderboard();
    const origClose = closeLeaderboard;
    document.querySelector('#leaderboardOverlay .lb-close-btn').onclick = () => {
        closeLeaderboard();
        document.getElementById('submitOverlay').classList.remove('hidden');
    };
}

function showEndScreen() {
    gameState = 'END';
    document.getElementById('lbOpenBtn').style.display = 'block';
}

function escHtml(str) {
    return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
