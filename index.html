<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2D Touch Platformer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: sans-serif;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        /* Touch Controls Overlay */
        #touchControls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            pointer-events: none; /* Let clicks pass through container */
        }
        .control-group {
            display: flex;
            gap: 20px;
            pointer-events: auto; /* Enable clicks on actual buttons */
        }
        .btn {
            width: 70px;
            height: 70px;
            background-color: rgba(255, 255, 255, 0.3);
            border: 3px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 24px;
            touch-action: manipulation;
        }
        .btn:active {
            background-color: rgba(255, 255, 255, 0.6);
        }
        /* Hide touch UI on desktop if keyboard is preferred, 
           but kept visible by default for easy testing */
        @media (pointer: fine) {
            /* Optional: style differently for mouse/keyboard users */
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    
    <!-- On-screen UI Controls -->
    <div id="touchControls">
        <div class="control-group">
            <div id="btnLeft" class="btn">←</div>
            <div id="btnRight" class="btn">→</div>
        </div>
        <div class="control-group">
            <div id="btnJump" class="btn">▲</div>
        </div>
    </div>
</div>

<script>
// --- GAME CONFIGURATION & GLOBALS ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Virtual game resolution (independent of screen size)
const V_WIDTH = 800;
const V_HEIGHT = 450;

// Input State
const keys = { left: false, right: false, jump: false };

// --- MODULAR GAME CLASSES ---

class Player {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.width = 32;
        this.height = 48;
        this.vx = 0;
        this.vy = 0;
        this.speed = 5;
        this.jumpForce = 12;
        this.grounded = false;
        this.color = '#FF5733';
    }

    update(gravity, platforms) {
        // Apply Horizontal Input
        if (keys.left) this.vx = -this.speed;
        else if (keys.right) this.vx = this.speed;
        else this.vx = 0;

        // Apply Gravity
        this.vy += gravity;

        // Move Passionately (Horizontal First)
        this.x += this.vx;
        this.handleCollision(platforms, 'horizontal');

        // Move Vertically
        this.y += this.vy;
        this.grounded = false;
        this.handleCollision(platforms, 'vertical');
        
        // Screen boundaries
        if (this.x < 0) this.x = 0;
        if (this.x + this.width > V_WIDTH) this.x = V_WIDTH - this.width;
    }

    handleCollision(platforms, direction) {
        for (let platform of platforms) {
            // Check AABB Collision
            if (this.x < platform.x + platform.width &&
                this.x + this.width > platform.x &&
                this.y < platform.y + platform.height &&
                this.y + this.height > platform.y) {
                
                if (direction === 'horizontal') {
                    if (this.vx > 0) this.x = platform.x - this.width;
                    if (this.vx < 0) this.x = platform.x + platform.width;
                } else if (direction === 'vertical') {
                    if (this.vy > 0) { // Falling down
                        this.y = platform.y - this.height;
                        this.vy = 0;
                        this.grounded = true;
                    } else if (this.vy < 0) { // Jumping up
                        this.y = platform.y + platform.height;
                        this.vy = 0;
                    }
                }
            }
        }
    }

    jump() {
        if (this.grounded) {
            this.vy = -this.jumpForce;
            this.grounded = false;
        }
    }

    draw(ctx) {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.width, this.height);
    }
}

class Enemy {
    constructor(x, y, minX, maxX) {
        this.x = x;
        this.y = y;
        this.width = 30;
        this.height = 30;
        this.minX = minX; // Left patrol bound
        this.maxX = maxX; // Right patrol bound
        this.speed = 2;
        this.direction = 1; // 1 = Right, -1 = Left
        this.color = '#8B0000';
    }

    update() {
        this.x += this.speed * this.direction;

        // Turn around at patrol limits
        if (this.x >= this.maxX - this.width) {
            this.x = this.maxX - this.width;
            this.direction = -1;
        } else if (this.x <= this.minX) {
            this.x = this.minX;
            this.direction = 1;
        }
    }

    draw(ctx) {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.width, this.height);
    }
}

class Platform {
    constructor(x, y, width, height) {
        this.x = x;
        this.y = y;
        this.width = width;
        this.height = height;
        this.color = '#228B22';
    }

    draw(ctx) {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.width, this.height);
    }
}

// --- ENGINE / SETUP ---

const gravity = 0.6;
let player;
let platforms = [];
let enemies = [];

function init() {
    player = new Player(100, 300);

    // Build the Level
    platforms = [
        new Platform(0, 400, 800, 50),       // Ground
        new Platform(200, 300, 150, 20),     // Platform 1
        new Platform(450, 230, 200, 20),     // Platform 2
        new Platform(100, 180, 120, 20)      // Platform 3
    ];

    // Build Patrolling Enemies
    enemies = [
        new Enemy(220, 270, 200, 350),       // Patries platform 1
        new Enemy(500, 370, 400, 750)        // Patrols ground
    ];

    setupInputs();
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Start Game Loop
    requestAnimationFrame(gameLoop);
}

// Aspect ratio scaling for responsiveness
function resizeCanvas() {
    const windowWidth = window.innerWidth;
    const windowHeight = window.innerHeight;
    
    // Determine best fit scale
    const scale = Math.min(windowWidth / V_WIDTH, windowHeight / V_HEIGHT);
    
    canvas.width = V_WIDTH * scale;
    canvas.height = V_HEIGHT * scale;
    
    // Scale drawings context contextually
    ctx.scale(scale, scale);
}

// --- INPUT HANDLING ---

function setupInputs() {
    // Keyboard Event Listeners (Desktop testing)
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
        if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') {
            keys.jump = true;
            player.jump();
        }
    });

    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
        if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.jump = false;
    });

    // Touch Event Listeners (Mobile / Tablet)
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');
    const btnJump = document.getElementById('btnJump');

    // Helper to hook both touch and mouse events safely
    function bindTrigger(element, pressCallback, releaseCallback) {
        element.addEventListener('touchstart', (e) => { e.preventDefault(); pressCallback(); });
        element.addEventListener('touchend', (e) => { e.preventDefault(); releaseCallback(); });
        // Optional mouse backups for layout UI clicking
        element.addEventListener('mousedown', pressCallback);
        element.addEventListener('mouseup', releaseCallback);
    }

    bindTrigger(btnLeft, () => keys.left = true, () => keys.left = false);
    bindTrigger(btnRight, () => keys.right = true, () => keys.right = false);
    bindTrigger(btnJump, () => { player.jump(); }, () => {});
}

// --- CORE GAME LOOP ---

function checkCollisions() {
    // Basic Enemy-Player Collision check (Basic damage handling can be added here)
    for (let enemy of enemies) {
        if (player.x < enemy.x + enemy.width &&
            player.x + player.width > enemy.x &&
            player.y < enemy.y + enemy.height &&
            player.y + player.height > enemy.y) {
            
            // Minimalist Reset on hit
            player.x = 100;
            player.y = 300;
            player.vx = 0;
            player.vy = 0;
        }
    }
}

function gameLoop() {
    // 1. Update Game States
    player.update(gravity, platforms);
    enemies.forEach(enemy => enemy.update());
    checkCollisions();

    // 2. Clear Screen
    ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);

    // 3. Draw Game Objects
    platforms.forEach(platform => platform.draw(ctx));
    enemies.forEach(enemy => enemy.draw(ctx));
    player.draw(ctx);

    // Request next frame
    requestAnimationFrame(gameLoop);
}

// Initialize everything on window load
window.onload = init;
</script>

</body>
</html>
