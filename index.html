<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Large Sprite Platformer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #111; font-family: sans-serif; }
        #gameContainer { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        canvas { background: linear-gradient(to bottom, #2c3e50, #000000); display: block; }
        #touchControls { position: absolute; bottom: 30px; left: 0; width: 100%; display: flex; justify-content: space-between; padding: 0 40px; pointer-events: none; }
        .control-group { display: flex; gap: 25px; pointer-events: auto; }
        .btn { width: 80px; height: 80px; background-color: rgba(255, 255, 255, 0.2); border: 4px solid rgba(255, 255, 255, 0.4); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 30px; touch-action: manipulation; }
        .btn:active { background-color: rgba(255, 255, 255, 0.5); }
        #ui { position: absolute; top: 20px; left: 20px; color: #fff; font-size: 24px; font-weight: bold; text-shadow: 2px 2px #000; pointer-events: none; }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="ui">LEVEL: <span id="lvlDisplay">1</span></div>
    <canvas id="gameCanvas"></canvas>
    <div id="touchControls">
        <div class="control-group">
            <div id="btnLeft" class="btn">←</div>
            <div id="btnRight" class="btn">→</div>
        </div>
        <div class="control-group">
            <div id="btnJump" class="btn">UP</div>
        </div>
    </div>
</div>

<script>
// --- ASSET CONFIGURATION ---
const ASSETS = {
    player: 'player.png', // Your 600x1000 image
    enemy: 'enemy.png',   // Your 600x1000 image
    flag: 'flag.png'      // Your 600x1000 image
};

// Scaling: We take your 600x1000 and fit it into a playable hit-box
// This maintains the 0.6 aspect ratio of your images
const P_WIDTH = 60;   
const P_HEIGHT = 100; 

const images = {};
let imagesLoaded = 0;
const assetKeys = Object.keys(ASSETS);

function loadAssets(callback) {
    assetKeys.forEach(key => {
        const img = new Image();
        img.src = ASSETS[key];
        img.onload = () => {
            imagesLoaded++;
            if (imagesLoaded === assetKeys.length) callback();
        };
        img.onerror = () => { // Fallback if images aren't found on GitHub yet
            imagesLoaded++;
            if (imagesLoaded === assetKeys.length) callback();
        };
        images[key] = img;
    });
}

// --- GAME SETTINGS ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const V_WIDTH = 1200;  // Wider world for bigger sprites
const V_HEIGHT = 800;  // Taller world
const gravity = 0.8;
let currentLevel = 0;
let gameState = 'PLAY';

const keys = { left: false, right: false };

// --- LEVEL DATA ---
const LEVELS = [
    { // Level 1 (Tweak: Enemy moved to the ground under the platform)
        playerStart: {x: 100, y: 600},
        platforms: [{x:0, y:750, w:1200, h:50}, {x:400, y:550, w:300, h:30}],
        enemies: [{x:500, y:650, minX:400, maxX:700}], // Now patrols the ground floor
        flag: {x: 1050, y: 650}
    },
    { // Level 2 (Tweak: Swapped Enemy and Flag positions)
        playerStart: {x: 50, y: 600},
        platforms: [
            {x:0, y:750, w:350, h:50},     
            {x:550, y:750, w:650, h:50},   
            {x:200, y:620, w:200, h:30},   
            {x:450, y:480, w:200, h:30}    
        ],
        enemies: [{x:460, y:380, minX:450, maxX:650}], // Enemy is now up on Step 2
        flag: {x: 1050, y: 650}            // Flag is now on the far right ground
    },
    { // Level 3
       playerStart: {x: 50, y: 100},
        platforms: [
            {x:0, y:750, w:1200, h:50},    // Ground floor completely open from left to right
            {x:0, y:250, w:300, h:30},     // High left platform
            {x:100, y:550, w:300, h:30},    // Mid left platform
            {x:400, y:400, w:300, h:30},    // Center platform
            
            // THE PILLAR: Sits on the floor but leaves the sky completely wide open
            {x:750, y:430, w:50, h:320}     
        ],
        enemies: [
            {x:200, y:650, minX:50, maxX:700},   // Enemy walks freely on the left ground floor
            {x:450, y:300, minX:400, maxX:650}   // Patrols the center platform
        ],
        flag: {x: 1050, y: 650} // On the right ground floor
    },
    { // Level 4
        playerStart: {x: 100, y: 600},
        platforms: [{x:0, y:750, w:200, h:50}, {x:300, y:600, w:200, h:30}, {x:600, y:450, w:200, h:30}, {x:900, y:300, w:300, h:30}],
        enemies: [{x:950, y:200, minX:900, maxX:1150}],
        flag: {x: 1100, y: 200}
    },
    { // Level 5 (FIXED: Cut a passage through the wall, guarded by an enemy)
        playerStart: {x: 50, y: 650},
        platforms: [
            {x:0, y:750, w:1200, h:50}, 
            // Wall 1: Split into a lower wall and an upper wall to leave a gap at y:500-650
            {x:300, y:150, w:50, h:350},  // Top half of wall 1
            {x:300, y:650, w:50, h:100},  // Bottom half of wall 1
            // Wall 2: Split to leave a matching gap
            {x:700, y:0, w:50, h:500},    // Top half of wall 2
            {x:700, y:650, w:50, h:100}   // Bottom half of wall 2
        ],
        enemies: [
            {x:450, y:650, minX:360, maxX:690}, // Guarding the courtyard between walls
            {x:850, y:650, minX:760, maxX:1100} // Guarding the final flag approach
        ],
        flag: {x: 1050, y: 650}
    }
];

// --- CLASSES ---
class Player {
    constructor(x, y) { this.w = P_WIDTH; this.h = P_HEIGHT; this.reset(x, y); }
    reset(x, y) { this.x = x; this.y = y; this.vx = 0; this.vy = 0; this.grounded = false; }
    update(platforms) {
        if (keys.left) this.vx = -7;
        else if (keys.right) this.vx = 7;
        else this.vx = 0;
        this.vy += gravity;
        this.x += this.vx; this.collide(platforms, 'h');
        this.y += this.vy; this.grounded = false; this.collide(platforms, 'v');
        if (this.y > V_HEIGHT) this.reset(LEVELS[currentLevel].playerStart.x, LEVELS[currentLevel].playerStart.y);
    }
    collide(platforms, dir) {
        platforms.forEach(p => {
            if (this.x < p.x + p.w && this.x + this.w > p.x && this.y < p.y + p.h && this.y + this.h > p.y) {
                if (dir === 'h') this.x = (this.vx > 0) ? p.x - this.w : p.x + p.w;
                else {
                    if (this.vy > 0) { this.y = p.y - this.h; this.grounded = true; }
                    else this.y = p.y + p.h;
                    this.vy = 0;
                }
            }
        });
    }
    draw() {
        if (images.player.complete && images.player.width > 0) {
            ctx.drawImage(images.player, this.x, this.y, this.w, this.h);
        } else {
            ctx.fillStyle = '#FF5733'; ctx.fillRect(this.x, this.y, this.w, this.h);
        }
    }
}

class Enemy {
    constructor(data) {
        this.w = P_WIDTH; this.h = P_HEIGHT; 
        this.x = data.x; this.y = data.y; this.minX = data.minX; this.maxX = data.maxX;
        this.dir = 1;
    }
    update() {
        this.x += 3 * this.dir;
        if (this.x >= this.maxX - this.w || this.x <= this.minX) this.dir *= -1;
    }
    draw() {
        if (images.enemy.complete && images.enemy.width > 0) {
            ctx.drawImage(images.enemy, this.x, this.y, this.w, this.h);
        } else {
            ctx.fillStyle = '#8B0000'; ctx.fillRect(this.x, this.y, this.w, this.h);
        }
    }
}

// --- ENGINE ---
let player, enemies = [], platforms = [], flag = null;

function loadLevel(idx) {
    if (idx >= LEVELS.length) { gameState = 'END'; return; }
    const data = LEVELS[idx];
    player = new Player(data.playerStart.x, data.playerStart.y);
    platforms = data.platforms;
    flag = data.flag;
    enemies = data.enemies.map(e => new Enemy(e));
    document.getElementById('lvlDisplay').innerText = idx + 1;
}

function init() {
    loadLevel(0);
    setupInputs();
    resize();
    window.addEventListener('resize', resize);
    requestAnimationFrame(loop);
}

function resize() {
    const scale = Math.min(window.innerWidth / V_WIDTH, window.innerHeight / V_HEIGHT);
    canvas.width = V_WIDTH * scale; canvas.height = V_HEIGHT * scale;
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
}

function setupInputs() {
    const bL = document.getElementById('btnLeft'), bR = document.getElementById('btnRight'), bJ = document.getElementById('btnJump');
    
    // --- LEFT BUTTON ---
    bL.addEventListener('touchstart', (e) => { e.preventDefault(); keys.left = true; });
    bL.addEventListener('touchend', (e) => { e.preventDefault(); keys.left = false; });
    bL.addEventListener('mousedown', () => { keys.left = true; });
    bL.addEventListener('mouseup', () => { keys.left = false; });
    bL.addEventListener('mouseleave', () => { keys.left = false; }); // Stops stuck moving if mouse drifts off button

    // --- RIGHT BUTTON ---
    bR.addEventListener('touchstart', (e) => { e.preventDefault(); keys.right = true; });
    bR.addEventListener('touchend', (e) => { e.preventDefault(); keys.right = false; });
    bR.addEventListener('mousedown', () => { keys.right = true; });
    bR.addEventListener('mouseup', () => { keys.right = false; });
    bR.addEventListener('mouseleave', () => { keys.right = false; });

    // --- JUMP BUTTON ---
    const triggerJump = (e) => { 
        if(e) e.preventDefault(); 
        if(player.grounded) player.vy = -22; 
    };
    bJ.addEventListener('touchstart', triggerJump);
    bJ.addEventListener('mousedown', triggerJump);

    // --- KEYBOARD CONTROLS (BACKUP) ---
    window.addEventListener('keydown', e => {
        if(e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
        if(e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
        if(e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') if(player.grounded) player.vy = -22;
    });
    window.addEventListener('keyup', e => {
        if(e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
        if(e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    });
}

function loop() {
    ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);
    if (gameState === 'PLAY') {
        player.update(platforms);
        enemies.forEach(e => {
            e.update();
            if (player.x < e.x + e.w && player.x + player.w > e.x && player.y < e.y + e.h && player.y + player.h > e.y) {
                player.reset(LEVELS[currentLevel].playerStart.x, LEVELS[currentLevel].playerStart.y);
            }
        });

        if (player.x < flag.x + 60 && player.x + player.w > flag.x && player.y < flag.y + 100 && player.y + player.h > flag.y) {
            currentLevel++; loadLevel(currentLevel);
        }

        platforms.forEach(p => { ctx.fillStyle = '#34495e'; ctx.fillRect(p.x, p.y, p.w, p.h); });
        enemies.forEach(e => e.draw());
        player.draw();
        
        if (images.flag.complete && images.flag.width > 0) {
            ctx.drawImage(images.flag, flag.x, flag.y, 60, 100);
        } else {
            ctx.fillStyle = '#f1c40f'; ctx.fillRect(flag.x, flag.y, 60, 100);
        }
    } else {
        ctx.fillStyle = 'white'; ctx.font = '60px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('VEDERE C! HO SI!', V_WIDTH/2, V_HEIGHT/2);
    }
    requestAnimationFrame(loop);
}

loadAssets(init);
</script>
</body>
</html>
