<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Character Select Platformer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #111; font-family: sans-serif; }
        #gameContainer { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        canvas { background: linear-gradient(to bottom, #2c3e50, #000000); display: block; }
        #touchControls { position: absolute; bottom: 30px; left: 0; width: 100%; display: flex; justify-content: space-between; padding: 0 40px; pointer-events: none; display: none; }
        .control-group { display: flex; gap: 25px; pointer-events: auto; }
        .btn { width: 80px; height: 80px; background-color: rgba(255, 255, 255, 0.2); border: 4px solid rgba(255, 255, 255, 0.4); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 30px; touch-action: manipulation; }
        .btn:active { background-color: rgba(255, 255, 255, 0.5); }
        #ui { position: absolute; top: 20px; left: 20px; color: #fff; font-size: 24px; font-weight: bold; text-shadow: 2px 2px #000; pointer-events: none; display: none; }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="ui">LEVEL: <span id="lvlDisplay">1</span></div>
    <canvas id="gameCanvas"></canvas>
    
    <audio id="bgMusic" loop src="skunkorlicorice.mp3"></audio>

    <div id="touchControls">
        <div class="control-group">
            <div id="btnLeft" class="btn">←</div>
            <div id="btnRight" class="btn">→</div>
        </div>
        <div class="control-group">
            <div id="btnJump" class="btn">UP</div>
        </div>
    </div>
</div>

<script>
// --- CHARACTER PACK CONFIGURATION ---
// Customize the names and filenames here to match your repository assets exactly!
const CHARACTERS = {
    char1: {
        name: "CRIGUBE",
        player: "player.png",
        enemy: "enemy.png",
        flag: "flag.png"
    },
    char2: {
        name: "SKUNKSPRAY",
        player: "player2.png", 
        enemy: "enemy2.png",   
        flag: "flag2.png"      
    }
};

// Current Active Assets (will be rewritten by selection)
let ASSETS = { player: '', enemy: '', flag: '' };

const P_WIDTH = 60;   
const P_HEIGHT = 100; 

const images = {};
const uiImages = {}; // Keeps selection images in memory
let currentLevel = 0;
let gameState = 'SELECT'; // Starts in Selection Screen mode
let audioStarted = false;
let animationTimer = 0;

// Setup hitboxes for character select screen buttons
const selectButtons = [
    { id: 'char1', x: 250, y: 250, w: 250, h: 400 },
    { id: 'char2', x: 700, y: 250, w: 250, h: 400 }
];

// Load UI pre-selection image wrappers safely
function preloadSelectionImages(callback) {
    let loaded = 0;
    const paths = [CHARACTERS.char1.player, CHARACTERS.char2.player];
    const keys = ['char1', 'char2'];
    
    paths.forEach((path, i) => {
        const img = new Image();
        img.src = path;
        img.onload = img.onerror = () => {
            loaded++;
            if (loaded === paths.length) callback();
        };
        uiImages[keys[i]] = img;
    });
}

function loadGameplayAssets(callback) {
    let imagesLoaded = 0;
    const assetKeys = Object.keys(ASSETS);
    
    assetKeys.forEach(key => {
        const img = new Image();
        img.src = ASSETS[key];
        img.onload = img.onerror = () => {
            imagesLoaded++;
            if (imagesLoaded === assetKeys.length) callback();
        };
        images[key] = img;
    });
}

// --- GAME SETTINGS ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const V_WIDTH = 1200;  
const V_HEIGHT = 800;  
const gravity = 0.8;

const keys = { left: false, right: false };

// --- LEVEL DATA ---
const LEVELS = [
    { // Level 1
        playerStart: {x: 100, y: 600},
        platforms: [{x:0, y:750, w:1200, h:50}, {x:400, y:550, w:300, h:30}],

    { // Level 2

        playerStart: {x: 50, y: 100},

        ],
        enemies: [

        ],

    },
    { // Level 4
        playerStart: {x: 100, y: 600},
        platforms: [{x:0, y:750, w:200, h:50}, {x:300, y:600, w:200, h:30}, {x:600, y:450, w:200, h:30}, {x:900, y:300, w:300, h:30}],
        enemies: [{x:950, y:200, minX:900, maxX:1150}],
        flag: {x: 1100, y: 200}
    },
    { // Level 5
        playerStart: {x: 50, y: 650},
        platforms: [
            {x:0, y:750, w:1200, h:50},

];

// --- CLASSES ---
class Player {
    constructor(x, y) { this.w = P_WIDTH; this.h = P_HEIGHT; this.reset(x, y); }
    reset(x, y) { this.x = x; this.y = y; this.vx = 0; this.vy = 0; this.grounded = false; }
    update(platforms) {
        if (keys.left) this.vx = -7;
        else if (keys.right) this.vx = 7;
        else this.vx = 0;
        this.vy += gravity;
        this.x += this.vx; this.collide(platforms, 'h');
        this.y += this.vy; this.grounded = false; this.collide(platforms, 'v');
        if (this.y > V_HEIGHT) this.reset(LEVELS[currentLevel].playerStart.x, LEVELS[currentLevel].playerStart.y);
    }
    collide(platforms, dir) {
        platforms.forEach(p => {
            if (this.x < p.x + p.w && this.x + this.w > p.x && this.y < p.y + p.h && this.y + this.h > p.y) {
                if (dir === 'h') this.x = (this.vx > 0) ? p.x - this.w : p.x
