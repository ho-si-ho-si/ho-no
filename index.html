        #gameContainer { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        canvas { background: linear-gradient(to bottom, #87CEEB, #E0F6FF); display: block; }
        #touchControls { position: absolute; bottom: 20px; left: 0; width: 100%; display: flex; justify-content: space-between; padding: 0 30px; pointer-events: none; }

        .btn { width: 70px; height: 70px; background-color: rgba(255, 255, 255, 0.3); border: 3px solid rgba(255, 255, 255, 0.6); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; font-size: 24px; touch-action: manipulation; }
        .btn:active { background-color: rgba(255, 255, 255, 0.6); }
        #ui { position: absolute; top: 10px; left: 10px; color: #fff; font-size: 20px; text-shadow: 2px 2px #000; pointer-events: none; }

    player: '',

    flag: ''
};

const images = {};
let imagesLoaded = 0;
const totalImages = Object.keys(ASSETS).filter(k => ASSETS[k] !== '').length;

function loadAssets(callback) {
    if (totalImages === 0) return callback();
    for (let key in ASSETS) {
        if (ASSETS[key] !== '') {
            images[key] = new Image();
            images[key].src = ASSETS[key];
            images[key].onload = () => {
                imagesLoaded++;
                if (imagesLoaded === totalImages) callback();
            };
        }
    }
}
