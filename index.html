<script>
const LOOTLOCKER_GAME_KEY        = "dev_6bc4f8539dba4e76b852ef28a00217a1";
const LOOTLOCKER_GAME_ID         = "105125";                                     
const LOOTLOCKER_LEADERBOARD_KEY = "hosi_speedrun";                              
const LOOTLOCKER_API             = "https://api.lootlocker.io/game";

let llSessionToken = null;
let llPlayerId     = null;
let isPaused       = false;

async function llStartGuestSession() {
    if (llSessionToken) return true;
    let guestId = localStorage.getItem("ll_guest_id");
    if (!guestId) {
        guestId = "guest_" + Math.random().toString(36).substr(2, 12);
        localStorage.setItem("ll_guest_id", guestId);
    }
    try {
        const res = await fetch(`${LOOTLOCKER_API}/v2/session/guest`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "x-game-key": LOOTLOCKER_GAME_KEY, "x-game-version": "1.0.0" },
            body: JSON.stringify({ game_key: LOOTLOCKER_GAME_KEY, game_version: "1.0.0", identifier: guestId })
        });
        const data = await res.json();
        if (data.success) {
            llSessionToken = data.session_token;
            llPlayerId     = data.player_id;
            return true;
        }
        return false;
    } catch (e) { return false; }
}

async function llSetPlayerName(name) {
    try {
        await fetch(`${LOOTLOCKER_API}/player/name`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json", "x-session-token": llSessionToken, "LL-Version": "2021-03-01" },
            body: JSON.stringify({ name: name })
        });
    } catch (e) {}
}

async function llSubmitScore(name, timeMs, characterName) {
    const ok = await llStartGuestSession();
    if (!ok) return { success: false, error: "Nessuna sessione" };
    await llSetPlayerName(name);
    const metadata = "playername:" + name + "|character:" + characterName;
    try {
        const res = await fetch(`${LOOTLOCKER_API}/leaderboards/${LOOTLOCKER_LEADERBOARD_KEY}/submit`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "x-session-token": llSessionToken },
            body: JSON.stringify({ score: timeMs, member_id: String(llPlayerId), metadata: metadata })
        });
        return await res.json();
    } catch (e) { return { success: false, error: String(e) }; }
}

async function llGetLeaderboard(count = 15) {
    const ok = await llStartGuestSession();
    if (!ok) return null;
    try {
        const res = await fetch(`${LOOTLOCKER_API}/leaderboards/${LOOTLOCKER_LEADERBOARD_KEY}/list?count=${count}`, {
            headers: { "x-session-token": llSessionToken }
        });
        return await res.json();
    } catch (e) { return null; }
}

function formatTime(ms) {
    let minutes      = Math.floor(ms / 60000);
    let seconds      = Math.floor((ms % 60000) / 1000);
    let centiseconds = Math.floor((ms % 1000) / 10);
    return `${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}.${String(centiseconds).padStart(2,'0')}`;
}

function updateLbBtnVisibility() {
    const btn = document.getElementById('lbOpenBtn');
    const rBtn = document.getElementById('resetGameBtn');
    btn.style.display = (gameState === 'SELECT' || gameState === 'LEVEL_SELECT' || gameState === 'END') ? 'block' : 'none';
    rBtn.style.display = (gameState === 'END') ? 'block' : 'none';
}

async function openLeaderboard() {
    const overlay = document.getElementById('leaderboardOverlay');
    const statusEl = document.getElementById('lbStatus');
    const tbody = document.getElementById('lbBody');
    overlay.classList.remove('hidden');
    statusEl.textContent = "Loading...";
    tbody.innerHTML = "";

    const data = await llGetLeaderboard(15);
    statusEl.textContent = "";
    if (!data || !data.items || data.items.length === 0) {
        statusEl.textContent = data ? "Non ci sono tempi - diventa il primo!" : "Server indisponibile.";
        return;
    }

    data.items.forEach((entry, i) => {
        const rank = i + 1;
        let processedPlayerName = "";
        let characterUsed = "";

        if (entry.metadata && entry.metadata.includes("playername:") && entry.metadata.includes("|character:")) {
            const sepIdx = entry.metadata.indexOf("|character:");
            processedPlayerName = entry.metadata.slice("playername:".length, sepIdx).trim();
            characterUsed = entry.metadata.slice(sepIdx + "|character:".length).trim();
        }
        if (!processedPlayerName) {
            if (entry.player && entry.player.name) processedPlayerName = entry.player.name;
            else if (entry.member_id) processedPlayerName = String(entry.member_id);
            else processedPlayerName = "ANONIMO";
        }

        let fullDisplayHtml = escHtml(processedPlayerName);
        if (characterUsed) {
            fullDisplayHtml += ` <span style="font-size: 13px; color: #aaa; margin-left: 8px;">(${escHtml(characterUsed)})</span>`;
        }

        const timeStr = formatTime(entry.score);
        const medals = ["\u{1F947}","\u{1F948}","\u{1F949}"];
        const rankDisplay = rank <= 3 ? medals[rank-1] : `<span class="rank-badge">${rank}</span>`;
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${rankDisplay}</td><td>${fullDisplayHtml}</td><td>${timeStr}</td>`;
        tbody.appendChild(tr);
    });
}

function closeLeaderboard() { document.getElementById('leaderboardOverlay').classList.add('hidden'); }

function togglePause() {
    if (gameState !== 'PLAY') return;
    isPaused = !isPaused;
    const overlay = document.getElementById('pauseOverlay');
    const music = document.getElementById('bgMusic');
    if (isPaused) {
        overlay.classList.remove('hidden');
        if (audioStarted) music.pause();
    } else {
        overlay.classList.add('hidden');
        if (audioStarted) music.play().catch(()=>{});
    }
}

function restartLevel() {
    isPaused = false;
    document.getElementById('pauseOverlay').classList.add('hidden');
    const music = document.getElementById('bgMusic');
    if (audioStarted) music.play().catch(()=>{});
    loadLevel(currentLevel);
}

function resetToMenu() {
    isPaused = false;
    isTimerActive = false;
    deathCount = 0;
    const dDisp = document.getElementById('deathDisplay');
    if (dDisp) dDisp.innerText = deathCount;
    
    document.getElementById('pauseOverlay').classList.add('hidden');
    document.getElementById('ui').style.display = 'none';
    document.getElementById('touchControls').style.display = 'none';
    
    const music = document.getElementById('bgMusic');
    if (audioStarted) {
        music.pause();
        music.currentTime = 0;
        audioStarted = false;
    }
    
    gameState = 'SELECT';
    updateLbBtnVisibility();
}

function showSubmitOverlay(timeMs) {
    document.getElementById('submitTimeDisplay').textContent = "TEMPO: " + formatTime(timeMs) + " | MORTI: " + deathCount;
    document.getElementById('submitStatus').textContent = "";
    document.getElementById('playerNameInput').value = localStorage.getItem("ll_last_name") || "";

async function submitScore() {
    const input   = document.getElementById('playerNameInput');
    const statusEl = document.getElementById('submitStatus');
    const name    = input.value.trim() || "ANONIMO";
    localStorage.setItem("ll_last_name", name);

    statusEl.textContent = "Inviando...";

            showEndScreen();
        }, 1400);
    } else {
        statusEl.textContent = "❌ Invio fallito. Controlla le chiavi API.";

}

function preloadSelectionImages(callback) {
    let loaded = 0;
    const keys  = ['char1','char3','char2','char4','char5','char6'];
    const paths = [CHARACTERS.char1.player, CHARACTERS.char3.player, CHARACTERS.char2.player, CHARACTERS.char4.player, CHARACTERS.char5.player, CHARACTERS.char6.player];
    let done = false;
    const checkDone = () => { loaded++; if (loaded === paths.length && !done) { done = true; callback(); } };
    paths.forEach((path, i) => {
        const img = new Image();
        img.onload = checkDone; img.onerror = checkDone; img.src = path;
        uiImages[keys[i]] = img;
    });
}

function loadGameplayAssets(callback) {
    let imagesLoaded = 0;
    const assetKeys  = Object.keys(ASSETS);
    let done = false;
    const checkDone = () => { imagesLoaded++; if (imagesLoaded === assetKeys.length && !done) { done = true; callback(); } };
    assetKeys.forEach(key => {
        const img = new Image();
        img.onload = checkDone; img.onerror = checkDone; img.src = ASSETS[key];
        images[key] = img;
    });
}

class Fireball {
    constructor(x,y,vx,vy,type='standard'){ this.x=x; this.y=y; this.vx=vx; this.vy=vy; this.r=type==='spike'?8:12; this.type=type; }
    update(dt=1){ this.x+=this.vx*dt; this.y+=this.vy*dt; return !(this.x<-100||this.x>V_WIDTH+100||this.y<-100||this.y>V_HEIGHT+100); }
    draw(){
        ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); 
        if(this.type==='spike') {
            ctx.fillStyle='#95a5a6'; ctx.fill();
            ctx.beginPath(); ctx.arc(this.x,this.y,this.r*0.5,0,Math.PI*2); ctx.fillStyle='#ecf0f1'; ctx.fill();
        } else {
            ctx.fillStyle='#ff3300'; ctx.fill();
            ctx.beginPath(); ctx.arc(this.x,this.y,this.r*0.6,0,Math.PI*2); ctx.fillStyle='#ffcc00'; ctx.fill();
        }
    }
}

class PlayerLaser {
    constructor(x, y, dir) { this.x = x; this.y = y; this.vx = dir * 14; this.vy = 0; this.w = 24; this.h = 8; }
    update(dt=1) { this.x += this.vx * dt; return !(this.x < 0 || this.x > V_WIDTH); }
    draw() { ctx.fillStyle = '#1abc9c'; ctx.fillRect(this.x, this.y, this.w, this.h); }
}

let playerLasers = [];

class Player {
    constructor(x,y){ this.w=P_WIDTH; this.h=P_HEIGHT; this.reset(x,y, true); }
    reset(x,y, isInitialLoad = false){ 
        this.x=x; this.y=y; this.vx=0; this.vy=0; this.grounded=false;
        if(!isInitialLoad) deathCount++;
        const dDisp = document.getElementById('deathDisplay');
        if (dDisp) dDisp.innerText = deathCount;
    }
    update(platforms, dt=1){
        if(keys.left) { this.vx=-7; playerFacingDir = -1; } 
        else if(keys.right) { this.vx=7; playerFacingDir = 1; } 
        else this.vx=0;
        
        this.vy+=gravity*dt;
        this.x+=this.vx*dt; this.collide(platforms,'h');
        this.y+=this.vy*dt; this.grounded=false; this.collide(platforms,'v');
        if(this.y>V_HEIGHT) this.reset(LEVELS[currentLevel].playerStart.x, LEVELS[currentLevel].playerStart.y);
    }
    collide(platforms,dir){
        platforms.forEach(p=>{
            if(this.x<p.x+p.w&&this.x+this.w>p.x&&this.y<p.y+p.h&&this.y+this.h>p.y){
                if(dir==='h') this.x=(this.vx>0)?p.x-this.w:p.x+p.w;
                else{ if(this.vy>0){this.y=p.y-this.h;this.grounded=true;}else this.y=p.y+p.h; this.vy=0; }
            }
        });
    }
    draw(){
        ctx.save();
        if(playerFacingDir === -1) {
            ctx.translate(this.x + this.w, this.y);
            ctx.scale(-1, 1);
        } else {
            ctx.translate(this.x, this.y);
        }
        if(images.player&&images.player.complete&&images.player.width>0) {
            ctx.drawImage(images.player, 0, 0, this.w, this.h);
        } else { 
            ctx.fillStyle='#FF5733'; ctx.fillRect(0, 0, this.w, this.h); 
        }
        if(hasGunPowerup) {
            ctx.fillStyle = '#f39c12';
            ctx.fillRect(this.w - 10, 35, 20, 15);
        }
        ctx.restore();
    }
}

class Enemy {
    constructor(data){
        this.type=data.type||'patrol'; this.w=data.w||P_WIDTH; this.h=data.h||P_HEIGHT;
        this.x=data.x; this.y=data.y; this.minX=data.minX||0; this.maxX=data.maxX||V_WIDTH;
        this.dir=1; this.fvx=data.vx||0; this.fvy=data.vy||0; this.rate=data.rate||60; this.timer=0;
        
        if(this.type==='boss'){
            this.hp=5; this.maxHp=5; this.stateTimer=0; this.attackState=0; this.bossVx=4; this.isDead=false; this.deathTimer=0;
        }
        if(this.type==='boss2') {
            this.hp = 12; this.maxHp = 12; this.isDead = false;
            this.mouthOpen = false; this.mouthTimer = 0;
            this.bellyHp = 4; this.bellyDestroyed = false;
            this.attackTimer = 0;
        }
    }
    update(dt=1){
        if(this.type==='boss2') {
            if(this.isDead) return;
            
            this.attackTimer += dt;
            this.mouthTimer += dt;
            
            if(this.mouthTimer >= 140) {
                this.mouthOpen = !this.mouthOpen;
                this.mouthTimer = 0;
            }
            
            // Core attack cadence loop
            if(this.attackTimer >= 60) {
                this.attackTimer = 0;
                
                // Belly spike projectiles launch if intact
                if(!this.bellyDestroyed) {
                    fireballs.push(new Fireball(this.x + 20, this.y + 320, -5, -4, 'spike'));
                    fireballs.push(new Fireball(this.x + 40, this.y + 360, -6, -2, 'spike'));
                }
                
                // Giant mouth fireball weapon condition
                if(this.mouthOpen) {
                    fireballs.push(new Fireball(this.x + 30, this.y + 90, -8, 1));
                    fireballs.push(new Fireball(this.x + 30, this.y + 90, -7, 3));
                }
            }
            return;
        }
        
        if(this.type==='boss'){
            if(this.isDead){ this.deathTimer+=dt; this.w=Math.max(0, this.w-2*dt); this.h=Math.max(0, this.h-2*dt); return; }
            this.stateTimer += dt;
            if(this.stateTimer >= 200){ this.stateTimer = 0; this.attackState = Math.floor(Math.random()*3); }
            
            if(this.attackState===0){
                this.x += this.bossVx * dt; 
                if(this.x > 750 || this.x < 300) this.bossVx *= -1;
                this.y = 150 + Math.sin(this.stateTimer * 0.05) * 30;
                if(Math.floor(this.stateTimer)%35===0){ fireballs.push(new Fireball(this.x+this.w/2,this.y+this.h,(Math.random()-0.5)*4,5)); }
            } else if(this.attackState===1){
                this.x += this.bossVx * 1.5 * dt;
                if(this.x > 950 || this.x < 100) this.bossVx *= -1;
                this.y = 550 - Math.abs(Math.sin(this.stateTimer * 0.04) * 400);
                if(Math.floor(this.stateTimer)%45===0){
                    fireballs.push(new Fireball(this.x,this.y+this.h/2,-5,0)); fireballs.push(new Fireball(this.x+this.w,this.y+this.h/2,5,0));
                }
            } else if(this.attackState===2){
                this.x = 520; this.y = 450;
                if(Math.floor(this.stateTimer)===20 || Math.floor(this.stateTimer)===100){
                    for(let i=-2;i<=2;i++) fireballs.push(new Fireball(this.x+this.w/2,this.y+this.h/2,i*2,-5));
                }
            }
        } else if(this.type==='patrol'){
            this.x += 3 * this.dir * dt;
            if (this.x >= this.maxX - this.w || this.x <= this.minX) { this.dir *= -1; this.x = Math.max(this.minX, Math.min(this.maxX - this.w, this.x)); }
        } else if(this.type==='fireball'){
            this.timer+=dt;
            if(this.timer>=this.rate){ this.timer=0; fireballs.push(new Fireball(this.x+this.w/2,this.y+this.h/2,this.fvx,this.fvy)); }
        }
    }
    draw(){
        if(this.type==='boss2') {
            if(this.isDead) return;
            // Build visual composition layer stack for Kraid Boss
            ctx.fillStyle = '#1e824c'; // Reptilian green chassis
            ctx.fillRect(this.x, this.y, this.w, this.h);
            
            // Weakpoint structural mask context
            ctx.fillStyle = this.mouthOpen ? '#962d1f' : '#2e6640';
            ctx.fillRect(this.x, this.y + 70, 90, 50); // Mouth zone bound bounds
            
            ctx.fillStyle = '#f1c40f'; // Eyes
            ctx.fillRect(this.x + 40, this.y + 30, 20, 15);
            
            // Destructible belly layer render logic block
            if(!this.bellyDestroyed) {
                ctx.fillStyle = '#e67e22';
                ctx.fillRect(this.x, this.y + 260, 100, 160);
                ctx.fillStyle = '#fff'; // Spike nodes indicators visualizer
                ctx.fillRect(this.x + 15, this.y + 310, 20, 20);
                ctx.fillRect(this.x + 35, this.y + 350, 20, 20);
            }
            
            // Draw HP health indicator dynamic UI system overlay 
            ctx.fillStyle='#c0392b'; ctx.fillRect(400,30,400,20);
            ctx.fillStyle='#2ecc71'; ctx.fillRect(400,30,400*(this.hp/this.maxHp),20);
            ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.strokeRect(400,30,400,20);
            return;
        }
        
        if(this.type==='boss'){
            if(this.w<=0 || this.h<=0) return;
            ctx.fillStyle = this.attackState===0 ? '#d35400' : this.attackState===1 ? '#9b59b6' : '#8e44ad';
            ctx.fillRect(this.x,this.y,this.w,this.h);
            ctx.fillStyle='#c0392b'; ctx.fillRect(400,60,400,20);
            ctx.fillStyle='#2ecc71'; ctx.fillRect(400,60,400*(this.hp/this.maxHp),20);
            ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.strokeRect(400,60,400,20);
            return;
        }
        if(this.type==='fireball'){
            ctx.fillStyle='#e67e22'; ctx.fillRect(this.x,this.y,this.w,this.h); return;
        }
        ctx.fillStyle='#8B0000'; ctx.fillRect(this.x,this.y,this.w,this.h);
    }
}

let player, enemies=[], platforms=[], fireballs=[], flag=null;

function loadLevel(idx){
    fireballs=[];
    playerLasers=[];
    
    if(idx>=LEVELS.length){
        if(isTimerActive){
            finalTimeMs = Date.now() - startTime;
            finalTimeText = "TEMPO: " + formatTime(finalTimeMs) + " | MORTI: " + deathCount;
            pendingScoreMs = finalTimeMs;
        } else {
            finalTimeMs = 0; finalTimeText = "MODALITÀ TEST";
        }
        document.getElementById('ui').style.display='none';
        document.getElementById('touchControls').style.display='none';
        if(isTimerActive){ gameState = 'SUBMIT'; updateLbBtnVisibility(); showSubmitOverlay(finalTimeMs); } 
        else { showEndScreen(); }
        return;
    }

    currentLevel=idx;
    const data=LEVELS[idx];
    player=new Player(data.playerStart.x, data.playerStart.y);
    platforms=data.platforms; flag=data.flag;
    enemies=data.enemies.map(e=>new Enemy(e));
    document.getElementById('lvlDisplay').innerText=idx+1;
    
    if(currentLevel !== 19) {
        hasGunPowerup = false;
        document.getElementById('btnShoot').style.display = 'none';
    } else {
        if(LEVELS[19].gunPowerup) {
            hasGunPowerup = LEVELS[19].gunPowerup.collected;
            document.getElementById('btnShoot').style.display = hasGunPowerup ? 'flex' : 'none';
        }
    }
}

function firePlayerWeapon() {
    if(!hasGunPowerup || isPaused || gameState !== 'PLAY') return;
    let spawnX = playerFacingDir === 1 ? player.x + player.w : player.x - 24;
    let spawnY = player.y + 40;
    playerLasers.push(new PlayerLaser(spawnX, spawnY, playerFacingDir));
}

function drawCortisoloMeter() {
    if (!player) return;
    let minDistance = Infinity;
    const pCenterX = player.x + player.w / 2;
    const pCenterY = player.y + player.h / 2;

    enemies.forEach(e => {
        if (e.isDead) return;
        const dist = Math.hypot(pCenterX - (e.x + e.w / 2), pCenterY - (e.y + e.h / 2));
        if (dist < minDistance) minDistance = dist;
    });
    fireballs.forEach(fb => {
        const dist = Math.hypot(pCenterX - fb.x, pCenterY - fb.y);
        if (dist < minDistance) minDistance = dist;
    });

    const maxTrackDist = 400, minTrackDist = 45;
    let clampedDist = Math.max(minTrackDist, Math.min(maxTrackDist, minDistance));
    let t = (clampedDist - minTrackDist) / (maxTrackDist - minTrackDist); 
    let targetAngleDeg = 7 + (1 - t) * 150;
    let angleRad = Math.max(7, Math.min(157, targetAngleDeg)) * Math.PI / 180;

    const meterX = V_WIDTH - 150, meterY = 145, mW = 160, mH = 80;
    ctx.save();
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('CORTISOLO', meterX, meterY - mH - 12);
    ctx.restore();

    if (images.meter && images.meter.complete && images.meter.width > 0) {
        ctx.drawImage(images.meter, meterX - mW / 2, meterY - mH, mW, mH);
    } else {
        ctx.save(); ctx.beginPath(); ctx.arc(meterX, meterY, 70, Math.PI, 0, false); ctx.lineWidth = 15; ctx.strokeStyle = '#2ecc71'; ctx.stroke(); ctx.restore();
    }
    ctx.save(); ctx.translate(meterX, meterY); ctx.rotate(angleRad); ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(-65, 0); ctx.lineTo(0, 4); ctx.closePath(); ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.restore();
}

function init(){
    setupInputs(); resize();
    window.addEventListener('resize',resize);
    preloadSelectionImages(()=>{ gameState='SELECT'; updateLbBtnVisibility(); requestAnimationFrame(loop); });
}

function resize(){
    const scale=Math.min(window.innerWidth/V_WIDTH, window.innerHeight/V_HEIGHT);
    canvas.width=V_WIDTH*scale; canvas.height=V_HEIGHT*scale;
    ctx.setTransform(scale,0,0,scale,0,0);
}

function startAudio(){
    if(!audioStarted && !isPaused){
        const music=document.getElementById('bgMusic');
        music.volume=0.4; music.loop=true;
        music.play().then(()=>{ audioStarted=true; }).catch(()=>{});
    }
}

function handleSelectionClick(canvasX,canvasY){
    if(gameState==='SELECT'){
        selectButtons.forEach(btn=>{
            if(canvasX>=btn.x&&canvasX<=btn.x+btn.w&&canvasY>=btn.y&&canvasY<=btn.y+btn.h){
                let targetId = btn.id;
                ASSETS.player=CHARACTERS[targetId].player; ASSETS.flag=CHARACTERS[targetId].flag; ASSETS.flagGrey=CHARACTERS[targetId].flagGrey;
                activeVictoryText=CHARACTERS[targetId].victoryText; activeCharName=CHARACTERS[targetId].name; activeCharPlayer=CHARACTERS[targetId].player;
                loadGameplayAssets(()=>{ gameState='LEVEL_SELECT'; updateLbBtnVisibility(); });
            }
        });
    } else if(gameState==='LEVEL_SELECT'){
        if(canvasX>=backBtnProps.x && canvasX<=backBtnProps.x+backBtnProps.w && canvasY>=backBtnProps.y && canvasY<=backBtnProps.y+backBtnProps.h) {
            gameState = 'SELECT'; updateLbBtnVisibility(); return;
        }
        
        if(currentLevelPage === 0 && canvasX>=nextPageBtnProps.x && canvasX<=nextPageBtnProps.x+nextPageBtnProps.w && canvasY>=nextPageBtnProps.y && canvasY<=nextPageBtnProps.y+nextPageBtnProps.h) {
            currentLevelPage = 1; return;
        }
        if(currentLevelPage === 1 && canvasX>=prevPageBtnProps.x && canvasX<=prevPageBtnProps.x+prevPageBtnProps.w && canvasY>=prevPageBtnProps.y && canvasY<=prevPageBtnProps.y+prevPageBtnProps.h) {
            currentLevelPage = 0; return;
        }

        levelSelectButtons.forEach(btn=>{
            if(btn.page === currentLevelPage && canvasX>=btn.x&&canvasX<=btn.x+btn.w&&canvasY>=btn.y&&canvasY<=btn.y+btn.h){
                document.getElementById('ui').style.display='flex';
                document.getElementById('touchControls').style.display='flex';
                document.getElementById('lbOpenBtn').style.display='none';
                if(btn.levelIndex===0){ startTime=Date.now(); isTimerActive=true; }
                else{ isTimerActive=false; document.getElementById('timerDisplay').innerText="MODALITÀ TEST"; }
                loadLevel(btn.levelIndex);
                gameState='PLAY';
            }
        });
    } else if(gameState==='END'){ openLeaderboard(); }
}

function setupInputs() {
    const bL=document.getElementById('btnLeft'), bR=document.getElementById('btnRight'), bJ=document.getElementById('btnJump'), bS=document.getElementById('btnShoot');
    const getCanvasCoordinates=(e)=>{
        if (isPaused) return;
        startAudio();
        const rect=canvas.getBoundingClientRect();
        const clientX=e.touches?e.touches[0].clientX:e.clientX;
        const clientY=e.touches?e.touches[0].clientY:e.clientY;
        const scaleX=V_WIDTH/rect.width, scaleY=V_HEIGHT/rect.height;
        const x=(clientX-rect.left)*scaleX, y=(clientY-rect.top)*scaleY;
        if(gameState==='SELECT'||gameState==='LEVEL_SELECT'||gameState==='END') handleSelectionClick(x,y);
    };
    canvas.addEventListener('mousedown',getCanvasCoordinates);
    canvas.addEventListener('touchstart',(e)=>{ e.preventDefault(); getCanvasCoordinates(e); });

    bL.addEventListener('touchstart',(e)=>{e.preventDefault(); if(!isPaused) keys.left=true;});
    bL.addEventListener('touchend',(e)=>{e.preventDefault(); keys.left=false;});
    bL.addEventListener('mousedown',()=>{if(!isPaused) keys.left=true;}); bL.addEventListener('mouseup',()=>{keys.left=false;}); bL.addEventListener('mouseleave',()=>{keys.left=false;});
    bR.addEventListener('touchstart',(e)=>{e.preventDefault(); if(!isPaused) keys.right=true;});
    bR.addEventListener('touchend',(e)=>{e.preventDefault(); keys.right=false;});
    bR.addEventListener('mousedown',()=>{if(!isPaused) keys.right=true;}); bR.addEventListener('mouseup',()=>{keys.right=false;}); bR.addEventListener('mouseleave',()=>{keys.right=false;});
    
    bJ.addEventListener('touchstart',(e)=>{ e.preventDefault(); if(!isPaused && player && player.grounded) player.vy=-22; });
    bJ.addEventListener('mousedown',(e)=>{ e.preventDefault(); if(!isPaused && player && player.grounded) player.vy=-22; });
    
    bS.addEventListener('touchstart',(e)=>{ e.preventDefault(); firePlayerWeapon(); });
    bS.addEventListener('mousedown',(e)=>{ e.preventDefault(); firePlayerWeapon(); });
    
    window.addEventListener('keydown',e=>{
        if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { togglePause(); return; }
        if (isPaused) return;
        startAudio();
        if(e.key==='ArrowLeft'||e.key==='a') keys.left=true;
        if(e.key==='ArrowRight'||e.key==='d') keys.right=true;
        if((e.key===' '||e.key==='ArrowUp'||e.key==='w')&&player&&player.grounded) player.vy=-22;
        if(e.key==='f'||e.key==='x') firePlayerWeapon();
    });
    window.addEventListener('keyup',e=>{
        if(e.key==='ArrowLeft'||e.key==='a') keys.left=false;
        if(e.key==='ArrowRight'||e.key==='d') keys.right=false;
    });
}

function drawSelectionScreen(){
    ctx.fillStyle='white'; ctx.font='bold 44px sans-serif'; ctx.textAlign='center';
    ctx.fillText('SCONFIGGI I SARCHIAPONI!',V_WIDTH/2,80);
    
    selectButtons.forEach((btn)=>{
        ctx.fillStyle='rgba(255,255,255,0.05)'; ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=4;
        ctx.fillRect(btn.x,btn.y,btn.w,btn.h); ctx.strokeRect(btn.x,btn.y,btn.w,btn.h);
        ctx.fillStyle='#f1c40f'; ctx.font='bold 24px sans-serif'; ctx.fillText(CHARACTERS[btn.id].name,btn.x+btn.w/2,btn.y-15);
        ctx.save(); ctx.translate(btn.x+btn.w/2,btn.y+btn.h/2);
        
        const img=uiImages[btn.id];
        if(img&&img.complete&&img.width>0) { ctx.drawImage(img,-60,-100,120,200); } 
        else { ctx.fillStyle='#3399FF'; ctx.fillRect(-45,-75,90,150); }
        ctx.restore();
    });
}

function drawLevelSelectScreen(){
    ctx.fillStyle='white'; ctx.font='bold 48px sans-serif'; ctx.textAlign='center';
    ctx.fillText('SELEZIONA UN LIVELLO',V_WIDTH/2,130);
    
    ctx.fillStyle='#f1c40f'; ctx.font='bold 24px sans-serif';
    ctx.fillText(currentLevelPage === 0 ? "LIVELLI 1 - 10" : "LIVELLI 11 - 20", V_WIDTH/2, 200);

    levelSelectButtons.forEach(btn=>{
        if(btn.page !== currentLevelPage) return;
        ctx.fillStyle='rgba(255,255,255,0.1)'; ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=3;
        ctx.fillRect(btn.x,btn.y,btn.w,btn.h); ctx.strokeRect(btn.x,btn.y,btn.w,btn.h);
        ctx.fillStyle='#fff'; ctx.font='bold 32px sans-serif';
        ctx.fillText(btn.levelIndex+1,btn.x+btn.w/2,btn.y+btn.h/2+11);
    });
    
    ctx.fillStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=3;
    if(currentLevelPage === 0) {
        ctx.fillRect(nextPageBtnProps.x, nextPageBtnProps.y, nextPageBtnProps.w, nextPageBtnProps.h);
        ctx.fillStyle='#fff'; ctx.font='bold 36px sans-serif';
        ctx.fillText('→', nextPageBtnProps.x + 40, nextPageBtnProps.y + 52);
    } else {
        ctx.fillRect(prevPageBtnProps.x, prevPageBtnProps.y, prevPageBtnProps.w, prevPageBtnProps.h);
        ctx.fillStyle='#fff'; ctx.font='bold 36px sans-serif';
        ctx.fillText('←', prevPageBtnProps.x + 40, prevPageBtnProps.y + 52);
    }
    
    ctx.fillStyle='rgba(255,255,255,0.15)'; ctx.fillRect(backBtnProps.x, backBtnProps.y, backBtnProps.w, backBtnProps.h);
    ctx.fillStyle='#aaa'; ctx.font='bold 20px sans-serif';
    ctx.fillText('TORNA INDIETRO', backBtnProps.x + backBtnProps.w/2, backBtnProps.y + backBtnProps.h/2 + 7);
}

let lastFrameTime = null;
function loop(timestamp){
    const delta = lastFrameTime === null ? 16.667 : Math.min(timestamp - lastFrameTime, 50);
    lastFrameTime = timestamp; dt = delta / 16.667;

    if (!isPaused) animationTimer += 0.04 * dt;
    ctx.clearRect(0,0,V_WIDTH,V_HEIGHT);
    
    if(gameState==='SELECT'){ drawSelectionScreen(); updateLbBtnVisibility(); }
    else if(gameState==='LEVEL_SELECT'){ drawLevelSelectScreen(); updateLbBtnVisibility(); }
    else if(gameState==='PLAY'){
        if (!isPaused) {
            player.update(platforms, dt);
            
            if(currentLevel === 19 && LEVELS[19].gunPowerup && !LEVELS[19].gunPowerup.collected) {
                let item = LEVELS[19].gunPowerup;
                if(player.x < item.x + item.w && player.x + player.w > item.x && player.y < item.y + item.h && player.y + player.h > item.y) {
                    item.collected = true;
                    hasGunPowerup = true;
                    document.getElementById('btnShoot').style.display = 'flex';
                }
            }
            
            playerLasers = playerLasers.filter(laser => {
                let active = laser.update(dt);
                enemies.forEach(e => {
                    if(e.isDead) return;
                    if(laser.x > e.x && laser.x < e.x + e.w && laser.y > e.y && laser.y < e.y + e.h) {
                        active = false; 
                        if(e.type === 'boss2') {

                            let isMouthHit = (laser.y >= e.y + 70 && laser.y <= e.y + 120 && laser.x <= e.x + 90);
                            let isBellyHit = (laser.y >= e.y + 260 && laser.y <= e.y + 420 && laser.x <= e.x + 100);
                            
                            if(isMouthHit && e.mouthOpen) {
                                e.hp--;
                                if(e.hp <= 0) e.isDead = true;
                            } else if(isBellyHit && !e.bellyDestroyed) {
                                e.bellyHp--;
                                if(e.bellyHp <= 0) e.bellyDestroyed = true;
                            }
                        } else if(e.type === 'boss') {
                            e.hp--; if(e.hp <= 0) e.isDead = true;
                        }
                    }
                });
                return active;
            });
            
            fireballs=fireballs.filter(fb=>{
                let active=fb.update(dt);
                let dX=Math.abs(fb.x-(player.x+player.w/2)), dY=Math.abs(fb.y-(player.y+player.h/2));
                if(dX<(player.w/2+fb.r)&&dY<(player.h/2+fb.r)) {
                    player.reset(LEVELS[currentLevel].playerStart.x,LEVELS[currentLevel].playerStart.y); return false;
                }
                return active;
            });

            enemies.forEach(e=>{
                if(e.isDead) return;
                e.update(dt);
                if(player.x<e.x+e.w&&player.x+player.w>e.x&&player.y<e.y+e.h&&player.y+player.h>e.y){
                    if(e.type==='boss'){
                        if(player.vy>0&&player.y+player.h-player.vy<=e.y+40){ e.hp--; player.vy=-18; if(e.hp<=0) e.isDead=true; }
                        else { player.reset(LEVELS[currentLevel].playerStart.x,LEVELS[currentLevel].playerStart.y); }
                    } else if (e.type==='boss2') {
                        player.reset(LEVELS[currentLevel].playerStart.x,LEVELS[currentLevel].playerStart.y);
                    } else player.reset(LEVELS[currentLevel].playerStart.x,LEVELS[currentLevel].playerStart.y);
                }
            });

            let activeBossAlive = enemies.some(e => (e.type==='boss' || e.type==='boss2') && !e.isDead);
            if(!activeBossAlive){
                if(player.x<flag.x+60&&player.x+player.w>flag.x&&player.y<flag.y+100&&player.y+player.h>flag.y){ currentLevel++; loadLevel(currentLevel); }
            }
            if(isTimerActive){ let el=Date.now()-startTime; document.getElementById('timerDisplay').innerText=formatTime(el); }
        }

        // Draw routine elements calls space
        fireballs.forEach(fb => fb.draw());
        playerLasers.forEach(laser => laser.draw());
        platforms.forEach(p=>{ ctx.fillStyle='#34495e'; ctx.fillRect(p.x,p.y,p.w,p.h); });
        enemies.forEach(e=>e.draw()); player.draw();
        
        if(currentLevel === 19 && LEVELS[19].gunPowerup && !LEVELS[19].gunPowerup.collected) {
            let item = LEVELS[19].gunPowerup;
            ctx.fillStyle = '#f39c12'; ctx.fillRect(item.x, item.y, item.w, item.h);
            ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText('BEAM', item.x + 20, item.y + 24);
        }

        let activeBossAlive = enemies.some(e => (e.type==='boss' || e.type==='boss2') && !e.isDead);
        if(!activeBossAlive){
            ctx.fillStyle='#f1c40f'; ctx.fillRect(flag.x,flag.y,60,100);
        } else {
            ctx.fillStyle='#7f8c8d'; ctx.fillRect(flag.x,flag.y,60,100);
        }
        drawCortisoloMeter();
    } else if(gameState==='SUBMIT' || gameState==='END'){
        ctx.textAlign='center'; ctx.fillStyle='white'; ctx.font='bold 60px sans-serif'; ctx.fillText(activeVictoryText,V_WIDTH/2,V_HEIGHT/2-20);
        ctx.fillStyle='#f1c40f'; ctx.font='bold 40px sans-serif'; ctx.fillText(finalTimeText,V_WIDTH/2,V_HEIGHT/2+60);
        updateLbBtnVisibility();
    }
    requestAnimationFrame(loop);
}

init();
</script>
