const LOOTLOCKER_GAME_KEY        = "dev_6bc4f8539dba4e76b852ef28a00217a1";       // Game API Key
const LOOTLOCKER_GAME_ID         = "105125";                                     // Game ID  
const LOOTLOCKER_LEADERBOARD_KEY = "hosi_speedrun";                              // Leaderboard Key
const LOOTLOCKER_API             = "https://api.lootlocker.io/game";

let llSessionToken = null;
let llPlayerId     = null;
let isPaused       = false;

async function llStartGuestSession() {
    if (llSessionToken) return true;

    let guestId = localStorage.getItem("ll_guest_id");
    if (!guestId) {
        guestId = "guest_" + Math.random().toString(36).substr(2, 12);
        localStorage.setItem("ll_guest_id", guestId);
    }

    try {
        const res = await fetch(`${LOOTLOCKER_API}/v2/session/guest`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "x-game-key": LOOTLOCKER_GAME_KEY,
                "x-game-version": "1.0.0"
            },
            body: JSON.stringify({
                game_key: LOOTLOCKER_GAME_KEY,
                game_version: "1.0.0",
                identifier: guestId
            })
        });
        const data = await res.json();
        if (data.success) {
            llSessionToken = data.session_token;
            llPlayerId     = data.player_id;
            return true;
        }
        console.warn("LootLocker session failed:", data);
        return false;
    } catch (e) {
        console.warn("LootLocker session error:", e);
        return false;
    }
}

async function llSetPlayerName(name) {
    try {
        await fetch(`${LOOTLOCKER_API}/player/name`, {
            method: "PATCH",
            headers: {
                "Content-Type": "application/json",
                "x-session-token": llSessionToken,
                "LL-Version": "2021-03-01"
            },
            body: JSON.stringify({ name: name })
        });
    } catch (e) {
        console.warn("Could not set player name:", e);
    }
}

async function llSubmitScore(name, timeMs, characterName) {
    const ok = await llStartGuestSession();
    if (!ok) return { success: false, error: "Nessuna sessione" };

    await llSetPlayerName(name);

    const metadata = "playername:" + name + "|character:" + characterName;

    try {
        const res = await fetch(`${LOOTLOCKER_API}/leaderboards/${LOOTLOCKER_LEADERBOARD_KEY}/submit`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "x-session-token": llSessionToken
            },
            body: JSON.stringify({ 
                score: timeMs, 
                member_id: String(llPlayerId), 
                metadata: metadata 
            })
        });
        const data = await res.json();
        return data;
    } catch (e) {
        return { success: false, error: String(e) };
    }
}

async function llGetLeaderboard(count = 15) {
    const ok = await llStartGuestSession();
    if (!ok) return null;

    try {
        const res = await fetch(`${LOOTLOCKER_API}/leaderboards/${LOOTLOCKER_LEADERBOARD_KEY}/list?count=${count}`, {
            headers: { "x-session-token": llSessionToken }
        });
        const data = await res.json();
        return data;
    } catch (e) {
        return null;
    }
}

function formatTime(ms) {
    let minutes      = Math.floor(ms / 60000);
    let seconds      = Math.floor((ms % 60000) / 1000);
    let centiseconds = Math.floor((ms % 1000) / 10);
    return `${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}.${String(centiseconds).padStart(2,'0')}`;
}

function updateLbBtnVisibility() {
    const btn = document.getElementById('lbOpenBtn');
    const rBtn = document.getElementById('resetGameBtn');
    btn.style.display = (gameState === 'SELECT' || gameState === 'LEVEL_SELECT' || gameState === 'END') ? 'block' : 'none';
    rBtn.style.display = (gameState === 'END') ? 'block' : 'none';
}

async function openLeaderboard() {
    const overlay = document.getElementById('leaderboardOverlay');
    const statusEl = document.getElementById('lbStatus');
    const tbody = document.getElementById('lbBody');
    overlay.classList.remove('hidden');
    statusEl.textContent = "Loading...";
    tbody.innerHTML = "";

    const data = await llGetLeaderboard(15);
    statusEl.textContent = "";
    if (!data || !data.items || data.items.length === 0) {
        statusEl.textContent = data ? "Non ci sono tempi - diventa il primo!" : "Server indisponibile.";
        return;
    }

    data.items.forEach((entry, i) => {
        const rank = i + 1;
        
        let processedPlayerName = "";
        let characterUsed = "";

        if (entry.metadata && entry.metadata.includes("playername:") && entry.metadata.includes("|character:")) {
            const sepIdx = entry.metadata.indexOf("|character:");
            processedPlayerName = entry.metadata.slice("playername:".length, sepIdx).trim();
            characterUsed = entry.metadata.slice(sepIdx + "|character:".length).trim();
        }

        if (!processedPlayerName) {
            if (entry.player && entry.player.name) processedPlayerName = entry.player.name;
            else if (entry.member_id) processedPlayerName = String(entry.member_id);
            else processedPlayerName = "ANONIMO";
        }

        let fullDisplayHtml = escHtml(processedPlayerName);
        if (characterUsed) {
            fullDisplayHtml += ` <span style="font-size: 13px; color: #aaa; margin-left: 8px;">(${escHtml(characterUsed)})</span>`;
        }

        const timeStr = formatTime(entry.score);
        const medals = ["\u{1F947}","\u{1F948}","\u{1F949}"];
        const rankDisplay = rank <= 3 ? medals[rank-1] : `<span class="rank-badge">${rank}</span>`;
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${rankDisplay}</td><td>${fullDisplayHtml}</td><td>${timeStr}</td>`;
        tbody.appendChild(tr);
    });
}

function closeLeaderboard() {

function togglePause() {
    if (gameState !== 'PLAY') return;
    isPaused = !isPaused;
    const overlay = document.getElementById('pauseOverlay');
    const music = document.getElementById('bgMusic');
    
    if (isPaused) {
        overlay.classList.remove('hidden');
        if (audioStarted) music.pause();
    } else {
        overlay.classList.add('hidden');
        if (audioStarted) music.play().catch(()=>{});
    }
}

function restartLevel() {
    isPaused = false;
    document.getElementById('pauseOverlay').classList.add('hidden');
    const music = document.getElementById('bgMusic');

function resetToMenu() {

    document.getElementById('ui').style.display = 'none';

function preloadSelectionImages(callback) {
    let loaded = 0;
    const keys  = ['char1','char3','char2','char4','char5','char6'];
    const paths = [CHARACTERS.char1.player, CHARACTERS.char3.player, CHARACTERS.char2.player, CHARACTERS.char4.player, CHARACTERS.char5.player, CHARACTERS.char6.player];
    let done = false;
    const checkDone = () => { loaded++; if (loaded === paths.length && !done) { done = true; callback(); } };
    paths.forEach((path, i) => {
        const img = new Image();
        img.onload = checkDone; img.onerror = checkDone; img.src = path;
        uiImages[keys[i]] = img;
    });
}

function loadGameplayAssets(callback) {
    let imagesLoaded = 0;
    const assetKeys  = Object.keys(ASSETS);
    let done = false;
    const checkDone = () => { imagesLoaded++; if (imagesLoaded === assetKeys.length && !done) { done = true; callback(); } };
    assetKeys.forEach(key => {
        const img = new Image();
        img.onload = checkDone; img.onerror = checkDone; img.src = ASSETS[key];
        images[key] = img;
    });
}

class Fireball {
    constructor(x,y,vx,vy){ this.x=x; this.y=y; this.vx=vx; this.vy=vy; this.r=12; }
    update(dt=1){ this.x+=this.vx*dt; this.y+=this.vy*dt; return !(this.x<-100||this.x>V_WIDTH+100||this.y<-100||this.y>V_HEIGHT+100); }
    draw(){
        ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fillStyle='#ff3300'; ctx.fill();
        ctx.beginPath(); ctx.arc(this.x,this.y,this.r*0.6,0,Math.PI*2); ctx.fillStyle='#ffcc00'; ctx.fill();
    }
}

class Player {
    constructor(x,y){ this.w=P_WIDTH; this.h=P_HEIGHT; this.reset(x,y, true); }
    
    reset(x,y, isInitialLoad = false){ 
        this.x=x; this.y=y; this.vx=0; this.vy=0; this.grounded=false;
        
        if(!isInitialLoad) {
            deathCount++;
        }
        const dDisp = document.getElementById('deathDisplay');
        if (dDisp) dDisp.innerText = deathCount;
    }
    update(platforms, dt=1){
        if(keys.left) this.vx=-7; else if(keys.right) this.vx=7; else this.vx=0;
        this.vy+=gravity*dt;
        this.x+=this.vx*dt; this.collide(platforms,'h');
        this.y+=this.vy*dt; this.grounded=false; this.collide(platforms,'v');
        if(this.y>V_HEIGHT) this.reset(LEVELS[currentLevel].playerStart.x, LEVELS[currentLevel].playerStart.y);
    }
    collide(platforms,dir){
        platforms.forEach(p=>{
            if(this.x<p.x+p.w&&this.x+this.w>p.x&&this.y<p.y+p.h&&this.y+this.h>p.y){
                if(dir==='h') this.x=(this.vx>0)?p.x-this.w:p.x+p.w;
                else{ if(this.vy>0){this.y=p.y-this.h;this.grounded=true;}else this.y=p.y+p.h; this.vy=0; }
            }
        });
    }
    draw(){
        if(images.player&&images.player.complete&&images.player.width>0) ctx.drawImage(images.player,this.x,this.y,this.w,this.h);
        else{ ctx.fillStyle='#FF5733'; ctx.fillRect(this.x,this.y,this.w,this.h); }
    }
}

class Enemy {
    constructor(data){
        this.type=data.type||'patrol'; this.w=data.w||P_WIDTH; this.h=data.h||P_HEIGHT;
        this.x=data.x; this.y=data.y; this.minX=data.minX||0; this.maxX=data.maxX||V_WIDTH;
        this.dir=1; this.fvx=data.vx||0; this.fvy=data.vy||0; this.rate=data.rate||60; this.timer=0;
        if(this.type==='boss'){
            this.hp=5; this.maxHp=5; this.stateTimer=0; this.attackState=0; this.bossVx=4;
            this.isDead=false; this.deathTimer=0; this.crownX=0; this.crownY=0;
            this.crownVx=-4; this.crownVy=-15; this.crownAngle=0;
            this.initialW=this.w; this.initialH=this.h;
            this.targetX=this.x; this.targetY=this.y;
            
            this.attackState = 0;
            this.nextAttackState = 0;
            this.consecutiveStateCount = 1;
            this.hasRolledWarningState = false;
        }
    }
    update(dt=1){
        if(this.type==='boss'){
            if(this.isDead){
                this.deathTimer+=dt;
                this.crownX+=this.crownVx*dt; this.crownY+=this.crownVy*dt; this.crownVy+=gravity*dt; this.crownAngle+=0.1*dt;
                let tX=(V_WIDTH-this.w)/2, tY=(V_HEIGHT-this.h)/2;
                this.x+=(tX-this.x)*0.1*dt; this.y+=(tY-this.y)*0.1*dt;
                let scale=Math.max(0,1-(this.deathTimer/100));
                this.w=this.initialW*scale; this.h=this.initialH*scale;
                if(this.deathTimer>=100){this.w=0;this.h=0;}
                return;
            }
            
            this.stateTimer += dt;

            if (this.stateTimer >= 160 && !this.hasRolledWarningState) {
                this.hasRolledWarningState = true;
                
                let possibleStates = [0, 1, 2];
                if (this.consecutiveStateCount >= 2) {
                    possibleStates = possibleStates.filter(s => s !== this.attackState);
                }
                
                this.nextAttackState = possibleStates[Math.floor(Math.random() * possibleStates.length)];
            }
            
            if(this.stateTimer >= 200){
                this.stateTimer = 0;
                this.hasRolledWarningState = false;
                
                if (this.nextAttackState === this.attackState) {
                    this.consecutiveStateCount++;
                } else {
                    this.consecutiveStateCount = 1;
                }
                
                this.attackState = this.nextAttackState; 
                
                this.nextAttackState = this.attackState;

                this._lastBossShot0 = -1;
                this._lastBossShot1 = -1;
                this._lastBossShot2 = -1;
            }
            
            if(this.attackState===0){
                this.targetX += this.bossVx * dt; 
                if(this.targetX > 750) { this.bossVx = -4; this.targetX = 750; }
                if(this.targetX < 300) { this.bossVx = 4; this.targetX = 300; }
                
                this.targetY = 150 + Math.sin(this.stateTimer * 0.05) * 30;
                
                if(Math.floor(this.stateTimer)%35===0&&Math.floor(this.stateTimer)!==this._lastBossShot0){
                    this._lastBossShot0=Math.floor(this.stateTimer); 
                    fireballs.push(new Fireball(this.x+this.w/2,this.y+this.h,(Math.random()-0.5)*4,5));
                }
            } else if(this.attackState===1){
                this.targetX += this.bossVx * 1.5 * dt; 
                if(this.targetX > 950) { this.bossVx = -4; this.targetX = 950; }
                if(this.targetX < 100) { this.bossVx = 4; this.targetX = 100; }
                
                this.targetY = 550 - Math.abs(Math.sin(this.stateTimer * 0.04) * 400);
                
                if(Math.floor(this.stateTimer)%45===0&&Math.floor(this.stateTimer)!==this._lastBossShot1){
                    this._lastBossShot1=Math.floor(this.stateTimer);
                    fireballs.push(new Fireball(this.x,this.y+this.h/2,-5,0));
                    fireballs.push(new Fireball(this.x+this.w,this.y+this.h/2,5,0));
                }
            } else if(this.attackState===2){
                this.targetX = 520; 
                this.targetY = 450;
                
                if((Math.floor(this.stateTimer)===20||Math.floor(this.stateTimer)===100)&&Math.floor(this.stateTimer)!==this._lastBossShot2){
                    this._lastBossShot2=Math.floor(this.stateTimer);
                    for(let i=-2;i<=2;i++) fireballs.push(new Fireball(this.x+this.w/2,this.y+this.h/2,i*2,-5));
                    fireballs.push(new Fireball(this.x, this.y+this.h/2, -6, 0));
                    fireballs.push(new Fireball(this.x+this.w, this.y+this.h/2, 6, 0));
                }
            }
            
            this.x += (this.targetX - this.x) * 0.15 * dt;
            this.y += (this.targetY - this.y) * 0.15 * dt;

        } else if(this.type==='patrol'){
            this.x += 3 * this.dir * dt;
            if (this.x >= this.maxX - this.w) { this.dir = -1; this.x = this.maxX - this.w; }
            else if (this.x <= this.minX) { this.dir = 1; this.x = this.minX; }
        } else if(this.type==='fireball'){
            this.timer+=dt;
            if(this.timer>=this.rate){ this.timer=0; fireballs.push(new Fireball(this.x+this.w/2,this.y+this.h/2,this.fvx,this.fvy)); }
        }
    }
    draw(){
    if(this.type==='boss'){
        if(this.w>0&&this.h>0){
            const stateImages = [images.bossState1, images.bossState2, images.bossState3];
            const stateColors = ['#d35400', '#9b59b6', '#8e44ad'];
            
            let bossImg = stateImages[this.attackState];
            let fallbackColor = stateColors[this.attackState];
            
            if(this.stateTimer > 160 && this.nextAttackState !== this.attackState) {
                if(Math.floor(this.stateTimer / 10) % 2 === 0) {
                    bossImg = stateImages[this.nextAttackState];
                    fallbackColor = stateColors[this.nextAttackState];
                }
            }

            if(bossImg&&bossImg.complete&&bossImg.width>0) {
                ctx.drawImage(bossImg,this.x,this.y,this.w,this.h);
            } else { 
                ctx.fillStyle = fallbackColor; 
                ctx.fillRect(this.x,this.y,this.w,this.h); 
            }
                
                if(!this.isDead){
                    let cW=this.w*(256/418), cH=cW*(197/256);
                    let cX=this.x+(this.w-cW)/2, cY=this.y-cH+(cH*0.55);
                    if(images.bossCrown&&images.bossCrown.complete&&images.bossCrown.width>0) ctx.drawImage(images.bossCrown,cX,cY,cW,cH);
                    else{ ctx.fillStyle='#f1c40f'; ctx.fillRect(cX,cY,cW,cH); }
                }
            }
            if(this.isDead&&this.deathTimer<100){
                ctx.save(); ctx.translate(this.crownX,this.crownY); ctx.rotate(this.crownAngle);
                let cW=this.initialW*0.65, cH=cW*0.42;
                if(images.bossCrown&&images.bossCrown.complete&&images.bossCrown.width>0) ctx.drawImage(images.bossCrown,-cW/2,-cH/2,cW,cH);
                else{ ctx.fillStyle='#f1c40f'; ctx.fillRect(-cW/2,-cH/2,cW,cH); }
                ctx.restore();
            }
            if(!this.isDead){
                let hue = (animationTimer * 100) % 360;
    
                ctx.fillStyle = `hsl(${hue}, 100%, 60%)`;
                ctx.font = 'bold 22px sans-serif';
                ctx.textAlign = 'center';
                
                ctx.save();
                ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 2;
                
                ctx.fillText('RE SARCHIAPONE', 600, 45);
                ctx.restore();

                ctx.fillStyle='#c0392b'; ctx.fillRect(400,60,400,20);
                ctx.fillStyle='#2ecc71'; ctx.fillRect(400,60,400*(this.hp/this.maxHp),20);
                ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.strokeRect(400,60,400,20);
            }
            return;
        }
        if(this.type==='fireball'){
            if(images.fireEnemy&&images.fireEnemy.complete&&images.fireEnemy.width>0) ctx.drawImage(images.fireEnemy,this.x,this.y,this.w,this.h);
            else{ ctx.fillStyle='#e67e22'; ctx.fillRect(this.x,this.y,this.w,this.h); }
            return;
        }
        if(images.enemy&&images.enemy.complete&&images.enemy.width>0) ctx.drawImage(images.enemy,this.x,this.y,this.w,this.h);
        else{ ctx.fillStyle='#8B0000'; ctx.fillRect(this.x,this.y,this.w,this.h); }
    }
}

let player, enemies=[], platforms=[], fireballs=[], flag=null;

function loadLevel(idx){
    fireballs=[];
    if(idx>=LEVELS.length){
        if(isTimerActive){
            finalTimeMs = Date.now() - startTime;
            finalTimeText = "TEMPO: " + formatTime(finalTimeMs) + " | MORTI: " + deathCount;
            pendingScoreMs = finalTimeMs;
        } else {
            finalTimeMs = 0;
            finalTimeText = "MODALITÀ TEST";
        }
        document.getElementById('ui').style.display='none';
        document.getElementById('touchControls').style.display='none';
        if(isTimerActive){
            gameState = 'SUBMIT';
            updateLbBtnVisibility();
            showSubmitOverlay(finalTimeMs);
        } else {
            showEndScreen();
        }
        return;
    }

    currentLevel=idx;
    const data=LEVELS[idx];
    player=new Player(data.playerStart.x, data.playerStart.y);
    platforms=data.platforms; flag=data.flag;
    enemies=data.enemies.map(e=>new Enemy(e));
    document.getElementById('lvlDisplay').innerText=idx+1;
}

function drawCortisoloMeter() {
    if (!player) return;

    let minDistance = Infinity;
    const pCenterX = player.x + player.w / 2;
    const pCenterY = player.y + player.h / 2;

    enemies.forEach(e => {
        if (e.type === 'boss' && e.isDead) return;
        if (e.type === 'fireball') return;
        const eCenterX = e.x + e.w / 2;
        const eCenterY = e.y + e.h / 2;
        const dist = Math.hypot(pCenterX - eCenterX, pCenterY - eCenterY);
        if (dist < minDistance) minDistance = dist;
    });

    fireballs.forEach(fb => {
        const dist = Math.hypot(pCenterX - fb.x, pCenterY - fb.y);
        if (dist < minDistance) minDistance = dist;
    });

    const maxTrackDist = 400;
    const minTrackDist = 45;
    let clampedDist = Math.max(minTrackDist, Math.min(maxTrackDist, minDistance));
    
    let t = (clampedDist - minTrackDist) / (maxTrackDist - minTrackDist); 
    
    let targetAngleDeg = 5 + t * 175; 
    
    if (targetAngleDeg < 5) targetAngleDeg = 5;
    if (targetAngleDeg > 175) targetAngleDeg = 175;
    
    let angleRad = targetAngleDeg * Math.PI / 180;

    const meterX = V_WIDTH - 150;
    const meterY = 145;
    const mW = 160;
    const mH = 80;

    ctx.save();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
    ctx.shadowBlur = 4;
    ctx.shadowOffsetX = 2;
    ctx.shadowOffsetY = 2;
    ctx.fillText('CORTISOLO', meterX, meterY - mH - 12);
    ctx.restore();

    if (images.meter && images.meter.complete && images.meter.width > 0) {
        ctx.drawImage(images.meter, meterX - mW / 2, meterY - mH, mW, mH);
    } else {
        ctx.save();
        ctx.beginPath();
        ctx.arc(meterX, meterY, 70, Math.PI, 0, false);
        ctx.lineWidth = 15;
        ctx.strokeStyle = '#2ecc71';
        ctx.stroke();
        ctx.restore();
    }

    if (images.indicator && images.indicator.complete && images.indicator.width > 0) {
        ctx.save();
        ctx.translate(meterX, meterY);
        ctx.rotate(angleRad);
        const indW = 75;
        const indH = 24;
        ctx.drawImage(images.indicator, -indW + 10, -indH / 2, indW, indH);
        ctx.restore();
    } else {
        ctx.save();
        ctx.translate(meterX, meterY);
        ctx.rotate(angleRad);
        ctx.beginPath();
        ctx.moveTo(0, -4);
        ctx.lineTo(-65, 0);
        ctx.lineTo(0, 4);
        ctx.closePath();
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.restore();
    }
}

function startAudio(){
    if(!audioStarted && !isPaused){
        const music=document.getElementById('bgMusic');
        music.volume=0.4; music.loop=true;
        music.addEventListener('ended',function(){ this.currentTime=0; this.play().catch(()=>{}); },false);

function handleSelectionClick(canvasX,canvasY){
    if(gameState==='SELECT'){
        selectButtons.forEach(btn=>{
            if(canvasX>=btn.x&&canvasX<=btn.x+btn.w&&canvasY>=btn.y&&canvasY<=btn.y+btn.h){
                let targetId = btn.id;
                
                if(targetId === 'char5'){
                    const pool = ['char1', 'char3', 'char2'];
                    targetId = pool[Math.floor(Math.random() * pool.length)];
                }

                ASSETS.player=CHARACTERS[targetId].player;
                ASSETS.flag=CHARACTERS[targetId].flag;
                ASSETS.flagGrey=CHARACTERS[targetId].flagGrey;
                activeVictoryText=CHARACTERS[targetId].victoryText;
                activeCharName=CHARACTERS[targetId].name;
                activeCharPlayer=CHARACTERS[targetId].player;
                loadGameplayAssets(()=>{ gameState='LEVEL_SELECT'; updateLbBtnVisibility(); });
            }
        });
    } else if(gameState==='LEVEL_SELECT'){
        if(canvasX>=backBtnProps.x && canvasX<=backBtnProps.x+backBtnProps.w && canvasY>=backBtnProps.y && canvasY<=backBtnProps.y+backBtnProps.h) {
            gameState = 'SELECT';
            updateLbBtnVisibility();
            return;
        }

        levelSelectButtons.forEach(btn=>{
            if(canvasX>=btn.x&&canvasX<=btn.x+btn.w&&canvasY>=btn.y&&canvasY<=btn.y+btn.h){
                document.getElementById('ui').style.display='flex';
                document.getElementById('touchControls').style.display='flex';
                document.getElementById('lbOpenBtn').style.display='none';
                if(btn.levelIndex===0){ startTime=Date.now(); isTimerActive=true; }
                else{ isTimerActive=false; document.getElementById('timerDisplay').innerText="MODALITÀ TEST"; }
                loadLevel(btn.levelIndex);
                gameState='PLAY';
            }
        });
    } else if(gameState==='END'){
        openLeaderboard();
    }
}

function setupInputs() {
    const bL=document.getElementById('btnLeft'), bR=document.getElementById('btnRight'), bJ=document.getElementById('btnJump');
    const getCanvasCoordinates=(e)=>{
        if (isPaused) return;
        startAudio();
        const rect=canvas.getBoundingClientRect();
        const clientX=e.touches?e.touches[0].clientX:e.clientX;
        const clientY=e.touches?e.touches[0].clientY:e.clientY;
        const scaleX=V_WIDTH/rect.width, scaleY=V_HEIGHT/rect.height;
        const x=(clientX-rect.left)*scaleX, y=(clientY-rect.top)*scaleY;
        if(gameState==='SELECT'||gameState==='LEVEL_SELECT'||gameState==='END') handleSelectionClick(x,y);
    };
    canvas.addEventListener('mousedown',getCanvasCoordinates);
    canvas.addEventListener('touchstart',(e)=>{ e.preventDefault(); getCanvasCoordinates(e); });

    bL.addEventListener('touchstart',(e)=>{e.preventDefault(); if(!isPaused) keys.left=true;});
    bL.addEventListener('touchend',(e)=>{e.preventDefault(); keys.left=false;});
    bL.addEventListener('mousedown',()=>{if(!isPaused) keys.left=true;}); bL.addEventListener('mouseup',()=>{keys.left=false;}); bL.addEventListener('mouseleave',()=>{keys.left=false;});
    bR.addEventListener('touchstart',(e)=>{e.preventDefault(); if(!isPaused) keys.right=true;});
    bR.addEventListener('touchend',(e)=>{e.preventDefault(); keys.right=false;});
    bR.addEventListener('mousedown',()=>{if(!isPaused) keys.right=true;}); bR.addEventListener('mouseup',()=>{keys.right=false;}); bR.addEventListener('mouseleave',()=>{keys.right=false;});
    const triggerJump=(e)=>{ if(e)e.preventDefault(); if(!isPaused && player && player.grounded) player.vy=-22; };
    bJ.addEventListener('touchstart',triggerJump); bJ.addEventListener('mousedown',triggerJump);
    
    window.addEventListener('keydown',e=>{
        if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
            togglePause();
            return;
        }
        if (isPaused) return;
        startAudio();
        if(e.key==='ArrowLeft'||e.key==='a') keys.left=true;
        if(e.key==='ArrowRight'||e.key==='d') keys.right=true;
        if((e.key===' '||e.key==='ArrowUp'||e.key==='w')&&player&&player.grounded) player.vy=-22;
    });
    window.addEventListener('keyup',e=>{
        if(e.key==='ArrowLeft'||e.key==='a') keys.left=false;
        if(e.key==='ArrowRight'||e.key==='d') keys.right=false;
    });
}

function drawSelectionScreen(){

    ctx.fillText('SCONFIGGI I SARCHIAPONI!',V_WIDTH/2,80);
    
    selectButtons.forEach((btn,index)=>{
        ctx.fillStyle='rgba(255,255,255,0.05)'; ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=4;
        ctx.fillRect(btn.x,btn.y,btn.w,btn.h); ctx.strokeRect(btn.x,btn.y,btn.w,btn.h);
        ctx.fillStyle='#f1c40f'; ctx.font='bold 24px sans-serif';
        ctx.fillText(CHARACTERS[btn.id].name,btn.x+btn.w/2,btn.y-15);
        
        ctx.save(); 
        ctx.translate(btn.x+btn.w/2,btn.y+btn.h/2);
        
        if(btn.id==='char3' || btn.id==='char5'){ 
            const ps=1+Math.sin(animationTimer)*0.15; 
            ctx.scale(ps,ps); 
        } else { 
            const rd=(btn.id==='char1' || btn.id==='char4') ? 1 : -1; 
            ctx.rotate(Math.sin(animationTimer)*0.12*rd); 
        }
        
        const img=uiImages[btn.id];
        if(img&&img.complete&&img.width>0) {
            ctx.drawImage(img,-60,-100,120,200);
        } else { 
            ctx.fillStyle= (btn.id==='char1'||btn.id==='char4') ? '#FF5733' : (btn.id==='char3'||btn.id==='char5') ? '#2ECC71' : '#3399FF'; 
            ctx.fillRect(-45,-75,90,150); 
        }
        ctx.restore();
    });
    ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.font='18px sans-serif';
    ctx.fillText('🏆 PREMI LA CLASSIFICA PER VEDERE I TEMPI GLOBALI',V_WIDTH/2,770);
}

function drawLevelSelectScreen(){
    ctx.fillStyle='white'; ctx.font='bold 48px sans-serif'; ctx.textAlign='center';
    ctx.fillText('SELEZIONA UN LIVELLO',V_WIDTH/2,130);
    levelSelectButtons.forEach(btn=>{
        ctx.fillStyle='rgba(255,255,255,0.1)'; ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=3;
        ctx.fillRect(btn.x,btn.y,btn.w,btn.h); ctx.strokeRect(btn.x,btn.y,btn.w,btn.h);
        ctx.fillStyle='#fff'; ctx.font='bold 32px sans-serif';
        ctx.fillText(btn.levelIndex+1,btn.x+btn.w/2,btn.y+btn.h/2+11);
    });
    
    ctx.fillStyle='rgba(255,255,255,0.15)'; ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=2;
    ctx.fillRect(backBtnProps.x, backBtnProps.y, backBtnProps.w, backBtnProps.h);
    ctx.strokeRect(backBtnProps.x, backBtnProps.y, backBtnProps.w, backBtnProps.h);
    ctx.fillStyle='#aaa'; ctx.font='bold 20px sans-serif';
    ctx.fillText('TORNA INDIETRO', backBtnProps.x + backBtnProps.w/2, backBtnProps.y + backBtnProps.h/2 + 7);

    ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.font='18px sans-serif';
    ctx.fillText('⏱ COMINCIA DAL LIVELLO 1 PER INVIARE IL TUO TEMPO',V_WIDTH/2,740);
}

let lastFrameTime = null;
function loop(timestamp){
    const delta = lastFrameTime === null ? 16.667 : Math.min(timestamp - lastFrameTime, 50);
    lastFrameTime = timestamp;
    dt = delta / 16.667;

    if (!isPaused) {
        animationTimer += 0.04 * dt;
    }

    ctx.clearRect(0,0,V_WIDTH,V_HEIGHT);
    if(gameState==='SELECT'){ drawSelectionScreen(); updateLbBtnVisibility(); }
    else if(gameState==='LEVEL_SELECT'){ drawLevelSelectScreen(); updateLbBtnVisibility(); }
    else if(gameState==='PLAY'){
        if (!isPaused) {
            player.update(platforms, dt);
            fireballs=fireballs.filter(fb=>{
                let active=fb.update(dt);
                let dX=Math.abs(fb.x-(player.x+player.w/2)), dY=Math.abs(fb.y-(player.y+player.h/2));
                if(dX<(player.w/2+fb.r)&&dY<(player.h/2+fb.r)) {
                    player.reset(LEVELS[currentLevel].playerStart.x,LEVELS[currentLevel].playerStart.y);
                    return false;
                }
                return active;
            });
            enemies.forEach(e=>{
                e.update(dt);
                if(!e.isDead&&player.x<e.x+e.w&&player.x+player.w>e.x&&player.y<e.y+e.h&&player.y+player.h>e.y){
                    if(e.type==='boss'){
                        if(player.vy>0&&player.y+player.h-player.vy<=e.y+40){ 
                            if(e.attackState === 2) {
                                player.vy=-18; 
                            } else {
                                e.hp--; 
                                player.vy=-18; 
                                if(e.hp<=0){e.isDead=true;e.crownX=e.x+e.w/2;e.crownY=e.y;} 
                            }
                        }
                        else {
                            if(e.attackState === 2) {
                                player.vy=-18; 
                            } else {
                                player.reset(LEVELS[currentLevel].playerStart.x,LEVELS[currentLevel].playerStart.y);
                            }
                        }
                    } else player.reset(LEVELS[currentLevel].playerStart.x,LEVELS[currentLevel].playerStart.y);
                }
            });
            let isBossLevel=(currentLevel===9);
            let bossActive=enemies.some(e=>e.type==='boss'&&(!e.isDead||e.deathTimer<100));
            if(!bossActive||!isBossLevel){
                if(player.x<flag.x+60&&player.x+player.w>flag.x&&player.y<flag.y+100&&player.y+player.h>flag.y){ currentLevel++; loadLevel(currentLevel); }
            }
            if(isTimerActive){ let el=Date.now()-startTime; document.getElementById('timerDisplay').innerText=formatTime(el); }
        }

        fireballs.forEach(fb => fb.draw());
        platforms.forEach(p=>{ ctx.fillStyle='#34495e'; ctx.fillRect(p.x,p.y,p.w,p.h); });
        enemies.forEach(e=>e.draw()); player.draw();
        
        let isBossLevel=(currentLevel===9);
        let bossActive=enemies.some(e=>e.type==='boss'&&(!e.isDead||e.deathTimer<100));
        if(!bossActive||!isBossLevel){
            if(images.flag&&images.flag.complete&&images.flag.width>0) ctx.drawImage(images.flag,flag.x,flag.y,60,100);
            else{ ctx.fillStyle='#f1c40f'; ctx.fillRect(flag.x,flag.y,60,100); }
        } else {
            if(images.flagGrey&&images.flagGrey.complete&&images.flagGrey.width>0) ctx.drawImage(images.flagGrey,flag.x,flag.y,60,100);
            else{ ctx.fillStyle='#7f8c8d'; ctx.fillRect(flag.x,flag.y,60,100); ctx.fillStyle='#c0392b'; ctx.fillRect(flag.x+25,flag.y,10,100); }
        }

        drawCortisoloMeter();

    } else if(gameState==='SUBMIT'){
        ctx.textAlign='center';
        ctx.fillStyle='white'; ctx.font='bold 60px sans-serif'; ctx.fillText(activeVictoryText,V_WIDTH/2,V_HEIGHT/2-20);
        ctx.fillStyle='#f1c40f'; ctx.font='bold 40px sans-serif'; ctx.fillText(finalTimeText,V_WIDTH/2,V_HEIGHT/2+60);
    } else if(gameState==='END'){
        ctx.textAlign='center';
        ctx.fillStyle='white'; ctx.font='bold 60px sans-serif'; ctx.fillText(activeVictoryText,V_WIDTH/2,V_HEIGHT/2-20);
        ctx.fillStyle='#f1c40f'; ctx.font='bold 40px sans-serif'; ctx.fillText(finalTimeText,V_WIDTH/2,V_HEIGHT/2+60);
        ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.font='22px sans-serif';
        ctx.fillText('CLICCA DOVE VUOI PER VEDERE LA CLASSIFICA',V_WIDTH/2,V_HEIGHT/2+130);
        updateLbBtnVisibility();
    }
    requestAnimationFrame(loop);
}

init();

</script>
