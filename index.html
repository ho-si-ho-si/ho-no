<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HO SI!</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #111; font-family: sans-serif; }
        #gameContainer { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        canvas { background: linear-gradient(to bottom, #2c3e50, #000000); display: block; }
        #touchControls { position: absolute; bottom: 30px; left: 0; width: 100%; display: flex; justify-content: space-between; padding: 0 40px; pointer-events: none; display: none; }
        .control-group { display: flex; gap: 25px; pointer-events: auto; }
        .btn { width: 80px; height: 80px; background-color: rgba(255, 255, 255, 0.2); border: 4px solid rgba(255, 255, 255, 0.4); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 30px; touch-action: manipulation; }
        .btn:active { background-color: rgba(255, 255, 255, 0.5); }
        #ui { position: absolute; top: 20px; left: 20px; color: #fff; font-size: 24px; font-weight: bold; text-shadow: 2px 2px #000; pointer-events: none; display: none; }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="ui">LEVEL: <span id="lvlDisplay">1</span></div>
    <canvas id="gameCanvas"></canvas>
    
    <audio id="bgMusic" loop src="skunkorlicorice.mp3"></audio>

    <div id="touchControls">
        <div class="control-group">
            <div id="btnLeft" class="btn">←</div>
            <div id="btnRight" class="btn">→</div>
        </div>
        <div class="control-group">
            <div id="btnJump" class="btn">UP</div>
        </div>
    </div>
</div>

<script>
// --- CHARACTER PACK CONFIGURATION ---
// Customize the names and filenames here to match your repository assets exactly!
const CHARACTERS = {
    char1: {
        name: "CRIGUBE",
        player: "player.png",
        enemy: "enemy.png",
        flag: "flag.png"
    },
    char2: {
        name: "SKUNKSPRAY",
        player: "player2.png", 
        enemy: "enemy2.png",   
        flag: "flag2.png"      
    }
};

// Current Active Assets (will be rewritten by selection)
let ASSETS = { player: '', enemy: '', flag: '' };

const P_WIDTH = 60;   
const P_HEIGHT = 100; 

const images = {};
const uiImages = {}; // Keeps selection images in memory
let currentLevel = 0;
let gameState = 'SELECT'; // Starts in Selection Screen mode
let audioStarted = false;
let animationTimer = 0;

// Setup hitboxes for character select screen buttons
const selectButtons = [
    { id: 'char1', x: 250, y: 250, w: 250, h: 400 },
    { id: 'char2', x: 700, y: 250, w: 250, h: 400 }
];

// Load UI pre-selection image wrappers safely
function preloadSelectionImages(callback) {
    let loaded = 0;
    const paths = [CHARACTERS.char1.player, CHARACTERS.char2.player];
    const keys = ['char1', 'char2'];
    
    paths.forEach((path, i) => {
        const img = new Image();
        img.src = path;
        img.onload = img.onerror = () => {
            loaded++;
            if (loaded === paths.length) callback();
        };
        uiImages[keys[i]] = img;
    });
}

function loadGameplayAssets(callback) {
    let imagesLoaded = 0;
    const assetKeys = Object.keys(ASSETS);
    
    assetKeys.forEach(key => {
        const img = new Image();
        img.src = ASSETS[key];
        img.onload = img.onerror = () => {
            imagesLoaded++;
            if (imagesLoaded === assetKeys.length) callback();
        };
        images[key] = img;
    });
}

// --- GAME SETTINGS ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const V_WIDTH = 1200;  
const V_HEIGHT = 800;  
const gravity = 0.8;

const keys = { left: false, right: false };

// --- LEVEL DATA ---
const LEVELS = [
    { // Level 1
        playerStart: {x: 100, y: 600},
        platforms: [{x:0, y:750, w:1200, h:50}, {x:400, y:550, w:300, h:30}],
        enemies: [{x:500, y:650, minX:400, maxX:700}], 
        flag: {x: 1050, y: 650}
    },
    { // Level 2
        playerStart: {x: 50, y: 600},
        platforms: [
            {x:0, y:750, w:350, h:50},     
            {x:550, y:750, w:650, h:50},   
            {x:200, y:620, w:200, h:30},   
            {x:450, y:480, w:200, h:30}    
        ],
        enemies: [{x:460, y:380, minX:450, maxX:650}], 
        flag: {x: 1050, y: 650}            
    },
    { // Level 3 (Hanging wall forces player down)
        playerStart: {x: 50, y: 100},
        platforms: [
            {x:0, y:750, w:1200, h:50},    
            {x:0, y:250, w:300, h:30},     
            {x:100, y:550, w:300, h:30},    
            {x:400, y:400, w:300, h:30},    
            {x:750, y:0, w:60, h:530}     
        ],
        enemies: [
            {x:850, y:650, minX:820, maxX:1100}, 
            {x:450, y:300, minX:400, maxX:650}   
        ],
        flag: {x: 1050, y: 650} 
    },
    { // Level 4
        playerStart: {x: 100, y: 600},
        platforms: [{x:0, y:750, w:200, h:50}, {x:300, y:600, w:200, h:30}, {x:600, y:450, w:200, h:30}, {x:900, y:300, w:300, h:30}],
        enemies: [{x:950, y:200, minX:900, maxX:1150}],
        flag: {x: 1100, y: 200}
    },
    { // Level 5
        playerStart: {x: 50, y: 650},
        platforms: [
            {x:0, y:750, w:1200, h:50}, 
            {x:300, y:150, w:50, h:350},  
            {x:300, y:650, w:50, h:100},  
            {x:700, y:0, w:50, h:500},    
            {x:700, y:650, w:50, h:100}   
        ],
        enemies: [
            {x:450, y:650, minX:360, maxX:690}, 
            {x:850, y:650, minX:760, maxX:1100} 
        ],
        flag: {x: 1050, y: 650}
    }
];

// --- CLASSES ---
class Player {
    constructor(x, y) { this.w = P_WIDTH; this.h = P_HEIGHT; this.reset(x, y); }
    reset(x, y) { this.x = x; this.y = y; this.vx = 0; this.vy = 0; this.grounded = false; }
    update(platforms) {
        if (keys.left) this.vx = -7;
        else if (keys.right) this.vx = 7;
        else this.vx = 0;
        this.vy += gravity;
        this.x += this.vx; this.collide(platforms, 'h');
        this.y += this.vy; this.grounded = false; this.collide(platforms, 'v');
        if (this.y > V_HEIGHT) this.reset(LEVELS[currentLevel].playerStart.x, LEVELS[currentLevel].playerStart.y);
    }
    collide(platforms, dir) {
        platforms.forEach(p => {
            if (this.x < p.x + p.w && this.x + this.w > p.x && this.y < p.y + p.h && this.y + this.h > p.y) {
                if (dir === 'h') this.x = (this.vx > 0) ? p.x - this.w : p.x + p.w;
                else {
                    if (this.vy > 0) { this.y = p.y - this.h; this.grounded = true; }
                    else this.y = p.y + p.h;
                    this.vy = 0;
                }
            }
        });
    }
    draw() {
        if (images.player && images.player.complete && images.player.width > 0) {
            ctx.drawImage(images.player, this.x, this.y, this.w, this.h);
        } else {
            ctx.fillStyle = '#FF5733'; ctx.fillRect(this.x, this.y, this.w, this.h);
        }
    }
}

class Enemy {
    constructor(data) {
        this.w = P_WIDTH; this.h = P_HEIGHT; 
        this.x = data.x; this.y = data.y; this.minX = data.minX; this.maxX = data.maxX;
        this.dir = 1;
    }
    update() {
        this.x += 3 * this.dir;
        if (this.x >= this.maxX - this.w || this.x <= this.minX) this.dir *= -1;
    }
    draw() {
        if (images.enemy && images.enemy.complete && images.enemy.width > 0) {
            ctx.drawImage(images.enemy, this.x, this.y, this.w, this.h);
        } else {
            ctx.fillStyle = '#8B0000'; ctx.fillRect(this.x, this.y, this.w, this.h);
        }
    }
}

// --- ENGINE ---
let player, enemies = [], platforms = [], flag = null;

function loadLevel(idx) {
    if (idx >= LEVELS.length) { gameState = 'END'; return; }
    const data = LEVELS[idx];
    player = new Player(data.playerStart.x, data.playerStart.y);
    platforms = data.platforms;
    flag = data.flag;
    enemies = data.enemies.map(e => new Enemy(e));
    document.getElementById('lvlDisplay').innerText = idx + 1;
}

function init() {
    setupInputs();
    resize();
    window.addEventListener('resize', resize);
    preloadSelectionImages(() => {
        requestAnimationFrame(loop);
    });
}

function resize() {
    const scale = Math.min(window.innerWidth / V_WIDTH, window.innerHeight / V_HEIGHT);
    canvas.width = V_WIDTH * scale; canvas.height = V_HEIGHT * scale;
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
}

function startAudio() {
    if (!audioStarted) {
        const music = document.getElementById('bgMusic');
        music.volume = 0.4; 
        music.play().catch(err => console.log("Audio play deferred:", err));
        audioStarted = true;
    }
}

function handleSelectionClick(canvasX, canvasY) {
    selectButtons.forEach(btn => {
        if (canvasX >= btn.x && canvasX <= btn.x + btn.w && canvasY >= btn.y && canvasY <= btn.y + btn.h) {
            // Assign assets based on selection
            ASSETS.player = CHARACTERS[btn.id].player;
            ASSETS.enemy = CHARACTERS[btn.id].enemy;
            ASSETS.flag = CHARACTERS[btn.id].flag;
            
            // Trigger asset reload, reveal overlays, launch game
            loadGameplayAssets(() => {
                document.getElementById('ui').style.display = 'block';
                document.getElementById('touchControls').style.display = 'flex';
                loadLevel(0);
                gameState = 'PLAY';
            });
        }
    });
}

function setupInputs() {
    const bL = document.getElementById('btnLeft'), bR = document.getElementById('btnRight'), bJ = document.getElementById('btnJump');
    
    // --- CANVAS CLICK (For Character Selection Screen) ---
    const getCanvasCoordinates = (e) => {
        startAudio();
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        // Calculate raw position matching internal 1200x800 coordinate maps
        const scaleX = V_WIDTH / rect.width;
        const scaleY = V_HEIGHT / rect.height;
        const x = (clientX - rect.left) * scaleX;
        const y = (clientY - rect.top) * scaleY;
        
        if (gameState === 'SELECT') handleSelectionClick(x, y);
    };
    canvas.addEventListener('mousedown', getCanvasCoordinates);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); getCanvasCoordinates(e); });

    // --- LEFT BUTTON ---
    bL.addEventListener('touchstart', (e) => { e.preventDefault(); keys.left = true; });
    bL.addEventListener('touchend', (e) => { e.preventDefault(); keys.left = false; });
    bL.addEventListener('mousedown', () => { keys.left = true; });
    bL.addEventListener('mouseup', () => { keys.left = false; });
    bL.addEventListener('mouseleave', () => { keys.left = false; });

    // --- RIGHT BUTTON ---
    bR.addEventListener('touchstart', (e) => { e.preventDefault(); keys.right = true; });
    bR.addEventListener('touchend', (e) => { e.preventDefault(); keys.right = false; });
    bR.addEventListener('mousedown', () => { keys.right = true; });
    bR.addEventListener('mouseup', () => { keys.right = false; });
    bR.addEventListener('mouseleave', () => { keys.right = false; });

    // --- JUMP BUTTON ---
    const triggerJump = (e) => { 
        if(e) e.preventDefault(); 
        if(player && player.grounded) player.vy = -22; 
    };
    bJ.addEventListener('touchstart', triggerJump);
    bJ.addEventListener('mousedown', triggerJump);

    // --- KEYBOARD CONTROLS ---
    window.addEventListener('keydown', e => {
        startAudio();
        if(e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
        if(e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
        if(e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') if(player && player.grounded) player.vy = -22;
    });
    window.addEventListener('keyup', e => {
        if(e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
        if(e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    });
}

function drawSelectionScreen() {
    animationTimer += 0.04;

    // Header Title Text
    ctx.fillStyle = 'white'; ctx.font = 'bold 48px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('SELECT YOUR CHARACTER', V_WIDTH / 2, 120);

    selectButtons.forEach((btn, index) => {
        // Compute alternate rotation vectors (Character 1 rocks left-to-right, Character 2 rocks opposite)
        const rotationDirection = index === 0 ? 1 : -1;
        const angle = Math.sin(animationTimer) * 0.12 * rotationDirection; 

        // Draw Interactive Outer Card Outline Box
        ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 4;
        ctx.fillRect(btn.x, btn.y, btn.w, btn.h);
        ctx.strokeRect(btn.x, btn.y, btn.w, btn.h);

        // Character Identity Name Text Above
        ctx.fillStyle = '#f1c40f'; ctx.font = 'bold 36px sans-serif';
        ctx.fillText(CHARACTERS[btn.id].name, btn.x + btn.w / 2, btn.y - 25);

        // Render Animated Rotational Previews
        ctx.save();
        // Shift context anchor point to the center of card
        ctx.translate(btn.x + btn.w / 2, btn.y + btn.h / 2);
        ctx.rotate(angle);
        
        const img = uiImages[btn.id];
        if (img && img.complete && img.width > 0) {
            // Drawn using full aspect ratio proportions scaled beautifully inside the card
            ctx.drawImage(img, -90, -150, 180, 300);
        } else {
            // Visual fallback placeholder box
            ctx.fillStyle = index === 0 ? '#FF5733' : '#3399FF';
            ctx.fillRect(-60, -100, 120, 200);
        }
        ctx.restore();
    });
}

function loop() {
    ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);
    
    if (gameState === 'SELECT') {
        drawSelectionScreen();
    } else if (gameState === 'PLAY') {
        player.update(platforms);
        enemies.forEach(e => {
            e.update();
            if (player.x < e.x + e.w && player.x + player.w > e.x && player.y < e.y + e.h && player.y + player.h > e.y) {
                player.reset(LEVELS[currentLevel].playerStart.x, LEVELS[currentLevel].playerStart.y);
            }
        });

        if (player.x < flag.x + 60 && player.x + player.w > flag.x && player.y < flag.y + 100 && player.y + player.h > flag.y) {
            currentLevel++; loadLevel(currentLevel);
        }

        platforms.forEach(p => { ctx.fillStyle = '#34495e'; ctx.fillRect(p.x, p.y, p.w, p.h); });
        enemies.forEach(e => e.draw());
        player.draw();
        
        if (images.flag && images.flag.complete && images.flag.width > 0) {
            ctx.drawImage(images.flag, flag.x, flag.y, 60, 100);
        } else {
            ctx.fillStyle = '#f1c40f'; ctx.fillRect(flag.x, flag.y, 60, 100);
        }
    } else {
        ctx.fillStyle = 'white'; ctx.font = '60px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('HO SI! VEDERE C', V_WIDTH/2, V_HEIGHT/2);
    }
    requestAnimationFrame(loop);
}

init();
</script>
</body>
</html>
